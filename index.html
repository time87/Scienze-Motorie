<title>Registro Scienze Motorie</title>
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#17232F; --muted:#56636F;
  --line:#D3DCDA; --accent:#1C6E8C; --accent-ink:#FFFFFF; --mark:#E8B400; --mark-ink:#2B2200;
  --good:#2F8A57; --bad:#B83A2E; --good-ink:#1F6B42; --bad-ink:#9B2C22; --warn-bg:#FFF4CC; --warn-ink:#5A4500;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-bib: "Roboto Condensed", "Arial Narrow", "sans-serif-condensed", system-ui, sans-serif;
  --r-s:6px; --r-m:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101820; --surface:#18232D; --surface-2:#22303C; --ink:#E6ECEF; --muted:#9AA8B3;
    --line:#2C3B48; --accent:#4FA9C9; --accent-ink:#0B1A21; --mark:#E8B400; --mark-ink:#2B2200;
    --good:#5CC48A; --bad:#F07A6E; --good-ink:#7ED6A3; --bad-ink:#FF9C90; --warn-bg:#3A3110; --warn-ink:#F3DE8C;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* Struttura */
.app{display:flex; flex-direction:column; min-height:100vh}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ink); color:var(--bg); display:flex; align-items:center; gap:12px; padding:10px 16px}
.topbar h1{font-size:1.05rem; margin:0; font-weight:650; letter-spacing:.01em; flex:1}
.lanes{height:4px; background:repeating-linear-gradient(90deg, var(--mark) 0 28px, transparent 28px 40px)}
.save-state{font-size:.8rem; opacity:.8}
main{flex:1; width:100%; max-width:960px; margin:0 auto; padding:16px 16px 96px}
.nav{position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px 10px; text-decoration:none; color:var(--muted); font-size:.75rem; min-height:56px; position:relative}
.nav a svg{width:24px; height:24px}
.nav a[aria-current="page"]{color:var(--accent); font-weight:600}
.nav a[aria-current="page"]::before{content:""; position:absolute; top:0; left:25%; right:25%; height:3px; background:var(--accent); border-radius:0 0 3px 3px}
.nav .count{position:absolute; top:4px; left:calc(50% + 6px); background:var(--mark); color:var(--mark-ink); font-size:.68rem; font-weight:700; border-radius:9px; padding:0 5px; min-width:18px; text-align:center}
@media (min-width:900px){
  .app{flex-direction:row; flex-wrap:wrap}
  .topbar,.lanes{width:100%}
  .nav{position:sticky; top:62px; align-self:flex-start; flex-direction:column; width:200px; height:calc(100vh - 62px); border-top:0; border-right:1px solid var(--line); padding:12px 0}
  .nav a{flex:0; flex-direction:row; gap:12px; padding:12px 20px; font-size:.95rem; min-height:0}
  .nav a[aria-current="page"]::before{top:20%; bottom:20%; left:0; right:auto; width:3px; height:auto; border-radius:0 3px 3px 0}
  .nav .count{position:static; margin-left:auto}
  main{max-width:none; flex:1; padding:24px 32px 48px}
}

/* Tipografia e blocchi */
h2{font-size:1.5rem; margin:4px 0 16px; font-weight:700; letter-spacing:-.01em}
h3{font-size:1.1rem; margin:24px 0 10px}
.sub{color:var(--muted); margin:-10px 0 16px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px; margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.notice{background:var(--warn-bg); color:var(--warn-ink); border-radius:var(--r-m); padding:12px 14px; margin-bottom:16px}
.notice.danger{background:var(--bad); color:#fff}

/* Pulsanti e campi */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; font-weight:550}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45; cursor:not-allowed}
select,input[type=text],input[type=date],input[type=number]{min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface)}
label.field{display:flex; flex-direction:column; gap:4px; font-size:.9rem; color:var(--muted)}

/* Pettorale: elemento distintivo per le classi */
.bibs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.bib{position:relative; display:block; text-decoration:none; color:var(--ink); background:var(--surface); border:2px solid var(--ink); border-radius:4px; padding:14px 12px 12px; text-align:center}
.bib::before,.bib::after{content:""; position:absolute; top:7px; width:7px; height:7px; border-radius:50%; background:var(--line); box-shadow:0 0 0 1px var(--muted)}
.bib::before{left:8px} .bib::after{right:8px}
.bib-num{font-family:var(--font-bib); font-stretch:condensed; font-weight:800; font-size:2.8rem; line-height:1; letter-spacing:-.02em}
.bib-meta{font-size:.85rem; color:var(--muted); margin-top:6px}
.bib .pending{display:inline-block; margin-top:8px; background:var(--mark); color:var(--mark-ink); font-size:.75rem; font-weight:700; border-radius:10px; padding:1px 8px}
.bib:hover{border-color:var(--accent)}

/* Liste e tabelle */
.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m)}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list a,.list .item{display:flex; align-items:center; gap:10px; padding:12px 14px; min-height:48px; text-decoration:none; color:var(--ink)}
.tag{font-size:.75rem; border-radius:10px; padding:1px 8px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.tag.mark{background:var(--mark); color:var(--mark-ink); font-weight:700}
.tag.warn{background:var(--warn-bg); color:var(--warn-ink)}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; background:var(--surface); font-size:.9rem}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-weight:600; color:var(--muted)}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.tabs a{padding:10px 14px; text-decoration:none; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink); border-color:var(--accent); font-weight:600}
.empty{text-align:center; padding:32px 16px; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-size:1.1rem; margin-bottom:6px}

/* Finestra di conferma e avvisi */
dialog{border:0; border-radius:var(--r-m); padding:0; max-width:min(440px, calc(100vw - 32px)); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,20,28,.55)}
.modal-body{padding:20px}
.modal-body h3{margin:0 0 8px}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px}
.toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--r-s); max-width:calc(100vw - 32px); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}
.toast.error{background:var(--bad); color:#fff}
@media (min-width:900px){.toast{bottom:24px}}
footer.ver{font-size:.75rem; color:var(--muted); text-align:center; padding:24px 0 0}

/* M9: aggiornamento e uso offline */
.update-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; flex:0 0 100%; width:100%; background:var(--mark); color:var(--mark-ink); padding:8px 16px; font-size:.9rem; font-weight:600}
.update-bar .btn{background:var(--mark-ink); border-color:var(--mark-ink); color:#fff}
.update-bar .btn.ghost{background:transparent; color:var(--mark-ink); border-color:var(--mark-ink)}

/* M8: dati */
.notice .btn{margin-top:8px}
.err-list{margin:8px 0 0; padding-left:20px}
.err-list li{margin-bottom:4px}

/* M7: passaggio classi */
.steps{display:flex; flex-wrap:wrap; gap:6px; list-style:none; padding:0; margin:0 0 14px; counter-reset:st}
.steps li{counter-increment:st; display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--muted); padding:4px 10px 4px 5px; border:1px solid var(--line); border-radius:15px; background:var(--surface)}
.steps li::before{content:counter(st); display:inline-grid; place-items:center; width:21px; height:21px; border-radius:50%; background:var(--surface-2); color:var(--ink); font-weight:700; font-size:.75rem}
.steps li.done::before{background:var(--good); color:#fff}
.steps li[aria-current="step"]{border-color:var(--accent); color:var(--ink); font-weight:600}
.steps li[aria-current="step"]::before{background:var(--accent); color:var(--accent-ink)}
@media (max-width:620px){.steps li:not([aria-current]){font-size:0; gap:0; padding:3px}.steps li:not([aria-current])::before{font-size:.75rem}}
.wiz h3{margin-top:0}
.choices{display:flex; flex-direction:column; gap:8px; margin:10px 0}
.choice{display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface); cursor:pointer}
.choice input[type=radio]{width:20px; height:20px; margin:2px 0 0; accent-color:var(--accent); flex:0 0 auto}
.choice > span{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.choice:has(input:checked){border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.wiz .list label.item{cursor:pointer}
.wiz .list input[type=checkbox]{flex:0 0 auto}
.sumlist{display:grid; grid-template-columns:max-content 1fr; gap:8px 16px; margin:0 0 14px}
.sumlist dt{color:var(--muted)}
.sumlist dd{margin:0}
@media (max-width:480px){.sumlist{grid-template-columns:1fr; gap:2px}.sumlist dd{margin-bottom:8px}}

/* M6: grafici e progressi */
.pblock{margin-bottom:26px}
.pblock h3{margin-bottom:8px}
.chartbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:10px 10px 12px; margin-bottom:8px}

.trend.better{border-left-color:var(--good)} .trend.worse{border-left-color:var(--bad)} .trend.same{border-left-color:var(--muted)}

/* M4: sessioni di test */

.chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:0 12px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:.85rem; cursor:pointer; white-space:nowrap}

.entry{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px}

/* M3: elenco parametri */

<body>
<noscript><p style="padding:16px">Per usare il registro serve JavaScript attivo nel browser.</p></noscript>

<script>
'use strict';
/* =========================================================
   Registro Scienze Motorie — Modulo M1 (fondamenta)
   Un unico file, nessuna dipendenza, nessuna connessione esterna.
   ========================================================= */
const APP_ID = 'registro-scienze-motorie';
const SCHEMA_VERSION = 1;
const APP_VERSION = 'M9';

/* ---------- Utilità ---------- */
const U = {
  uid(prefix = 'id') {
    const a = new Uint8Array(8);
    if (globalThis.crypto && typeof crypto.getRandomValues === 'function') crypto.getRandomValues(a);
    else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    return prefix + '_' + Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Normalizza un nome per il confronto omonimie: niente accenti, maiuscole, spazi doppi. */
  normName(s) {
    return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  },
  /** Converte un input numerico accettando la virgola. Restituisce null se vuoto, NaN se non valido. */
  parseNum(str) {
    if (str === null || str === undefined) return null;
    const t = String(str).trim().replace(/\s/g, '').replace(',', '.');
    if (t === '') return null;
    if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
    return Number(t);
  },
  fmtNum(v, dec = 2) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    return Number(v).toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  },
  round(v, dec) { const f = 10 ** dec; return Math.round(v * f) / f; },
  isoFromDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  todayISO() { return U.isoFromDate(new Date()); },
  addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); return U.isoFromDate(new Date(y, m - 1, d + n)); },
  fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; },
  /** Migliore delle prove valide, secondo la direzione del parametro. */
  bestOf(trials, betterWhen) {
    const v = (trials || []).filter(x => typeof x === 'number' && !Number.isNaN(x));
    if (!v.length) return null;
    return betterWhen === 'lower' ? Math.min(...v) : Math.max(...v);
  },
  byName(a, b) {
    return (a.lastName + ' ' + a.firstName).localeCompare(b.lastName + ' ' + b.firstName, 'it', { sensitivity: 'base' });
  }
};

/* ---------- Stato iniziale e parametri predefiniti ---------- */
function defaultParameters() {
  const p = (id, name, unit, type, betterWhen, decimals, order, requiresEquipmentWeight = false) =>
    ({ id, name, unit, type, betterWhen, decimals, attempts: 3, requiresEquipmentWeight, active: true, order });
  return [
    p('p30', 'Corsa 30 m', 's', 'tempo', 'lower', 2, 1),
    p('p60', 'Corsa 60 m', 's', 'tempo', 'lower', 2, 2),
    p('p80', 'Corsa 80 m', 's', 'tempo', 'lower', 2, 3),
    p('pLungo', 'Salto in lungo', 'cm', 'distanza', 'higher', 0, 4),
    p('pVortex', 'Lancio del vortex', 'm', 'distanza', 'higher', 2, 5),
    p('pPeso', 'Getto del peso', 'm', 'distanza', 'higher', 2, 6, true),
    p('pPalla', 'Lancio della palla', 'm', 'distanza', 'higher', 2, 7, true),
    p('pFun', 'Salto della funicella', 'rip/30 s', 'conteggio', 'higher', 0, 8)
  ];
}
function emptyState() {
  return {
    app: APP_ID, schemaVersion: SCHEMA_VERSION, exportedAt: null,
    settings: { backupReminderDays: 14, lastBackupAt: null, selectedYearId: null },
    schoolYears: [], students: [], classes: [], enrollments: [],
    parameters: defaultParameters(), sessions: [], results: []
  };
}

/* ---------- Archiviazione locale ---------- */
const Storage = {
  mode: 'memory',      // 'idb' | 'local' | 'memory'
  persisted: null,     // il browser protegge i dati dalla pulizia automatica?
  db: null,
  async init() {
    if (globalThis.indexedDB) {
      try {
        this.db = await new Promise((res, rej) => {
          const r = indexedDB.open(APP_ID, 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error('Database bloccato da un\'altra scheda'));
        });
        await this._idbPut('__test', 1);
        this.mode = 'idb';
      } catch (e) {
        console.warn('IndexedDB non disponibile, uso localStorage', e);
        this.db = null;
      }
    }
    if (this.mode !== 'idb') {
      try { localStorage.setItem('__rsm_test', '1'); localStorage.removeItem('__rsm_test'); this.mode = 'local'; }
      catch (e) { this.mode = 'memory'; }
    }
    try {
      if (navigator.storage && navigator.storage.persist) {
        this.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      }
    } catch (e) { this.persisted = null; }
  },
  _idbPut(key, val) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  _idbGet(key) {
    return new Promise((res, rej) => {
      const r = this.db.transaction('kv', 'readonly').objectStore('kv').get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async load() {
    let raw = null;
    if (this.mode === 'idb') raw = await this._idbGet('state');
    else if (this.mode === 'local') raw = localStorage.getItem('rsm_state');
    return raw ? JSON.parse(raw) : null;
  },
  async save(state) {
    const json = JSON.stringify(state);
    if (this.mode === 'idb') return this._idbPut('state', json);
    if (this.mode === 'local') return localStorage.setItem('rsm_state', json);
  }
};

let S = emptyState();

/** Salva lo stato corrente. Da chiamare dopo ogni modifica. */
async function commit(message) {
  const el = document.getElementById('saveState');
  try {
    await Storage.save(S);
    el.textContent = Storage.mode === 'memory' ? 'Non salvato' : 'Salvato';
    if (message) toast(message);
  } catch (e) {
    console.error(e);
    el.textContent = 'Errore';
    toast('Salvataggio non riuscito: ' + e.message, 'error');
  }
  updateNavCounts();
}

/* ---------- Interrogazioni sui dati ---------- */
const Q = {
  years() { return [...S.schoolYears].sort((a, b) => b.label.localeCompare(a.label)); },
  year(id) { return S.schoolYears.find(y => y.id === id); },
  cls(id) { return S.classes.find(c => c.id === id); },
  student(id) { return S.students.find(s => s.id === id); },
  param(id) { return S.parameters.find(p => p.id === id); },
  session(id) { return S.sessions.find(s => s.id === id); },
  classesOfYear(yid) {
    return S.classes.filter(c => c.schoolYearId === yid).sort((a, b) => a.name.localeCompare(b.name, 'it', { numeric: true }));
  },
  params(includeArchived = false) {
    return S.parameters.filter(p => includeArchived || p.active).sort((a, b) => a.order - b.order);
  },
  activeEnrollments(cid) { return S.enrollments.filter(e => e.classId === cid && !e.removedAt); },
  studentsOfClass(cid) {
    return Q.activeEnrollments(cid).map(e => Q.student(e.studentId)).filter(Boolean).sort(U.byName);
  },
  sessionsOfClass(cid) {
    return S.sessions.filter(s => s.classId === cid).sort((a, b) => b.date.localeCompare(a.date) || (Q.param(a.parameterId)?.order ?? 0) - (Q.param(b.parameterId)?.order ?? 0));
  },
  resultsOfSession(sid) { return S.results.filter(r => r.sessionId === sid); },
  /** Prove ancora da recuperare per una classe (solo studenti ancora iscritti). */
  pendingOfClass(cid) {
    const active = new Set(Q.activeEnrollments(cid).map(e => e.studentId));
    const sess = new Set(S.sessions.filter(s => s.classId === cid).map(s => s.id));
    return S.results.filter(r => r.status === 'assente' && sess.has(r.sessionId) && active.has(r.studentId));
  },
  pendingAll() {
    return S.classes.flatMap(c => Q.pendingOfClass(c.id));
  },
  homonymCounts() {
    const m = new Map();
    for (const s of S.students) {
      const k = U.normName(s.lastName + ' ' + s.firstName);
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  },
  isHomonym(st, counts = Q.homonymCounts()) {
    return (counts.get(U.normName(st.lastName + ' ' + st.firstName)) || 0) > 1;
  },
  /** Nome visualizzato; per gli omonimi aggiunge alias o data di nascita. Testo semplice, da escapare. */
  displayName(st, counts = Q.homonymCounts()) {
    const base = `${st.lastName} ${st.firstName}`;
    if (!Q.isHomonym(st, counts)) return base;
    if (st.alias) return `${base} (${st.alias})`;
    if (st.birthDate) return `${base} (${U.fmtDate(st.birthDate)})`;
    return `${base} (omonimo da distinguere)`;
  },
  isRecovery(result) {
    const s = Q.session(result.sessionId);
    return result.status === 'misurato' && s && result.measuredOn && result.measuredOn !== s.date;
  }
};

/* ---------- Dati di esempio (valori fittizi generati a caso) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildDemoState() {
  const rnd = mulberry32(20250915);
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.73;
  const st = emptyState();
  const year = { id: U.uid('y'), label: '2025/26' };
  st.schoolYears.push(year);
  st.settings.selectedYearId = year.id;

  const classDefs = [
    { name: '1A', birthYear: 2014, older: false, names: [['Rossi','Marco'],['Sanna','Giulia'],['Pinna','Luca'],['Melis','Sara'],['Serra','Matteo'],['Piras','Chiara'],['Usai','Davide'],['Fadda','Elena'],['Mura','Andrea'],['Cocco','Sofia']] },
    { name: '1B', birthYear: 2014, older: false, names: [['Deiana','Alessio'],['Porcu','Martina'],['Carta','Simone'],['Atzeni','Alice'],['Floris','Gabriele'],['Lai','Aurora'],['Murgia','Tommaso'],['Pisano','Beatrice'],['Cabras','Federico'],['Orrù','Noemi'],['Loi','Riccardo']] },
    { name: '2A', birthYear: 2013, older: true, names: [['Rossi','Marco'],['Manca','Francesca'],['Contu','Lorenzo'],['Puddu','Anna'],['Ledda','Nicola'],['Zedda','Ilaria'],['Spiga','Pietro'],['Tola','Giorgia'],['Marras','Emanuele'],['Vacca','Camilla']] }
  ];
  // Modello fittizio per i dati di prova: base, dispersione, variazione per sessione
  const model = {
    p30: { base: 5.6, sd: 0.35, step: -0.08 }, p60: { base: 9.9, sd: 0.6, step: -0.15 }, p80: { base: 13.2, sd: 0.8, step: -0.2 },
    pLungo: { base: 165, sd: 18, step: 6 }, pVortex: { base: 24, sd: 6, step: 1.5 }, pPeso: { base: 5.8, sd: 0.9, step: 0.25 },
    pPalla: { base: 18, sd: 4, step: 1 }, pFun: { base: 55, sd: 10, step: 4 }
  };
  const rounds = ['2025-10-06', '2026-02-09', '2026-05-11'];
  const params = st.parameters;

  classDefs.forEach((cd, ci) => {
    const cls = { id: U.uid('c'), schoolYearId: year.id, name: cd.name, sourceClassId: null };
    st.classes.push(cls);
    const roster = cd.names.map(([lastName, firstName], i) => {
      const hasBirth = rnd() < 0.6;
      const month = 1 + Math.floor(rnd() * 12), day = 1 + Math.floor(rnd() * 28);
      const s = {
        id: U.uid('s'), firstName, lastName,
        birthDate: hasBirth ? `${cd.birthYear}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}` : null,
        alias: ''
      };
      // Omonimi di prova: uno distinto con la data di nascita, l'altro con l'alias
      if (lastName === 'Rossi' && cd.name === '1A') s.birthDate = '2014-03-15';
      if (lastName === 'Rossi' && cd.name === '2A') { s.birthDate = null; s.alias = 'Marco R. 2A'; }
      st.students.push(s);
      st.enrollments.push({ id: U.uid('e'), classId: cls.id, studentId: s.id, addedAt: '2025-09-15', removedAt: null });
      return { s, ability: gauss() };
    });

    params.forEach((p, pi) => {
      const m = model[p.id];
      rounds.forEach((rDate, ri) => {
        const date = U.addDays(rDate, Math.floor(pi / 2) * 7 + ci);
        let weight = null;
        if (p.id === 'pPeso') weight = cd.older ? (ri === 2 ? 4 : 3) : 2;
        if (p.id === 'pPalla') weight = 1;
        const ses = { id: U.uid('ses'), classId: cls.id, parameterId: p.id, date, equipmentWeightKg: weight };
        st.sessions.push(ses);
        roster.forEach(({ s, ability }) => {
          const r = { id: U.uid('r'), sessionId: ses.id, studentId: s.id, status: 'misurato', trials: [null, null, null], value: null, measuredOn: date };
          // Esonero di prova: uno studente della 1B esonerato dalle corse di febbraio
          if (cd.name === '1B' && s.lastName === 'Cabras' && ri === 1 && p.type === 'tempo') {
            r.status = 'esonerato'; r.measuredOn = null; st.results.push(r); return;
          }
          let measuredOn = date;
          if (rnd() < 0.08) {
            const recovered = ri < 2 || rnd() < 0.5;
            if (!recovered) { r.status = 'assente'; r.measuredOn = null; st.results.push(r); return; }
            measuredOn = U.addDays(date, 7);
          }
          const sign = p.betterWhen === 'lower' ? -1 : 1;
          const ageBonus = cd.older ? (p.betterWhen === 'lower' ? 0.96 : 1.06) : 1;
          let weightPenalty = 0;
          if (p.id === 'pPeso' && weight === 4) weightPenalty = -0.6;
          r.trials = [0, 1, 2].map(() => {
            if (rnd() < 0.05) return null; // prova nulla
            let v = m.base * ageBonus + sign * ability * m.sd + m.step * ri + weightPenalty + gauss() * m.sd * 0.2;
            v = Math.max(v, m.base * 0.3);
            return U.round(v, p.decimals);
          });
          if (r.trials.every(t => t === null)) r.trials[0] = U.round(m.base, p.decimals);
          r.value = U.bestOf(r.trials, p.betterWhen);
          r.measuredOn = measuredOn;
          st.results.push(r);
        });
      });
    });
  });
  return st;
}
function archiveIsEmpty() {
  return !S.schoolYears.length && !S.students.length && !S.classes.length && !S.results.length;

/* ---------- Interfaccia: avvisi e conferme ---------- */
let toastTimer = null;
function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}
/** Finestra di conferma. Con requireText l'utente deve digitare la parola indicata. */
function confirmDialog({ title, message, confirmLabel = 'Conferma', danger = false, requireText = null }) {
  return new Promise(resolve => {
    const d = document.getElementById('modal');
    d.onclick = d.oninput = d.onchange = d.onkeydown = null; d.className = '';
    d.innerHTML = `<div class="modal-body">
      <h3 id="modalTitle">${U.esc(title)}</h3>
      <p>${U.esc(message)}</p>
      ${requireText ? `<label class="field">Scrivi ${U.esc(requireText)} per confermare<input type="text" id="confirmText" autocomplete="off" autocapitalize="characters"></label>` : ''}
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close="cancel">Annulla</button>
        <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-close="ok" ${requireText ? 'disabled' : ''}>${U.esc(confirmLabel)}</button>
      </div></div>`;
    const ok = d.querySelector('[data-close="ok"]');
    const input = d.querySelector('#confirmText');
    if (input) input.addEventListener('input', () => { ok.disabled = input.value.trim().toUpperCase() !== requireText; });
    d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => d.close(b.dataset.close)));
    d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
    d.returnValue = '';
    d.showModal();
    (input || ok).focus();
  });
}
function notYet(moduleName) { toast(`Funzione in arrivo con il modulo ${moduleName}`); }

/** Elenco dei recuperi in sospeso, raggruppati per test e ordinati dalla sessione più vecchia. */
function pendingList(pend) {
  const counts = Q.homonymCounts();
  const groups = new Map();
  pend.forEach(r => {
    const ses = Q.session(r.sessionId);
    if (!ses) return;
    if (!groups.has(ses.parameterId)) groups.set(ses.parameterId, []);
    groups.get(ses.parameterId).push({ r, ses, s: Q.student(r.studentId) });
  });
  return [...groups.entries()]
    .sort((x, y) => (Q.param(x[0])?.order ?? 0) - (Q.param(y[0])?.order ?? 0))
    .map(([pid, items]) => {
      const p = Q.param(pid);
      items.sort((x, y) => x.ses.date.localeCompare(y.ses.date) || U.byName(x.s, y.s));
      return `<h4 class="grp">${U.esc(p?.name ?? '?')} <span class="small muted">${items.length} da recuperare</span></h4>
        <ul class="list">${items.map(({ r, ses, s }) => `<li><div class="item">
          <span><strong>${U.esc(Q.displayName(s, counts))}</strong><br>
          <span class="small muted">Sessione del ${U.fmtDate(ses.date)}${ses.equipmentWeightKg != null ? `, attrezzo da ${U.fmtKg(ses.equipmentWeightKg)} kg` : ''}</span></span>
          <span class="spacer"></span>
          <button type="button" class="btn" data-action="recoverResult" data-result="${r.id}" aria-label="Registra il recupero di ${U.esc(Q.displayName(s, counts))}">Registra</button></div></li>`).join('')}</ul>`;
    }).join('');
}

U.titleCase = function (s) {
  return s.toLowerCase().replace(/(^|[\s'’\-])(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase());
};
/** Toglie spazi doppi; se il testo è tutto maiuscolo o tutto minuscolo lo porta a "Iniziali Maiuscole". */
U.cleanName = function (s) {
  const t = String(s ?? '').replace(/\s+/g, ' ').trim();
  const hasLetters = t.toLowerCase() !== t.toUpperCase();
  return hasLetters && (t === t.toUpperCase() || t === t.toLowerCase()) ? U.titleCase(t) : t;
};

Q.removedOfClass = function (cid) {
  const active = new Set(Q.activeEnrollments(cid).map(e => e.studentId));
  const ids = new Set(S.enrollments.filter(e => e.classId === cid && e.removedAt && !active.has(e.studentId)).map(e => e.studentId));
  return [...ids].map(id => Q.student(id)).filter(Boolean).sort(U.byName);
};

const Ops = {
  suggestYear() {
    const starts = S.schoolYears.map(y => parseInt(y.label, 10)).filter(Number.isFinite);
    let start;
    if (starts.length) start = Math.max(...starts) + 1;
    else { const d = new Date(); start = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; }
    return `${start}/${String((start + 1) % 100).padStart(2, '0')}`;
  },
  yearError(label) {
    const m = /^(\d{4})\/(\d{2})$/.exec(label);
    if (!m) return 'Scrivi l\'anno nel formato 2026/27.';
    if ((Number(m[1]) + 1) % 100 !== Number(m[2])) return 'Le due parti dell\'anno devono essere consecutive, per esempio 2026/27.';
    if (S.schoolYears.some(y => y.label === label)) return 'Questo anno scolastico esiste già.';
    return '';
  },
  addYear(label) {
    const y = { id: U.uid('y'), label };
    S.schoolYears.push(y);
    S.settings.selectedYearId = y.id;
    return y;
  },
  classNameError(name, yearId, exceptId = null) {
    if (!name) return 'Scrivi il nome della classe.';
    if (name.length > 20) return 'Il nome della classe è troppo lungo (massimo 20 caratteri).';
    const k = U.normName(name);
    if (S.classes.some(c => c.schoolYearId === yearId && c.id !== exceptId && U.normName(c.name) === k)) return 'In questo anno esiste già una classe con questo nome.';
    return '';
  },
  addClass(yearId, name) {
    const c = { id: U.uid('c'), schoolYearId: yearId, name, sourceClassId: null };
    S.classes.push(c);
    return c;
  },
  /** Una classe si può eliminare solo se è vuota: nessuna iscrizione (nemmeno passata) e nessuna sessione. */
  classDeletable(cid) {
    return !S.enrollments.some(e => e.classId === cid) && !S.sessions.some(s => s.classId === cid);
  },
  studentError(first, last, birth) {
    if (!last) return 'Scrivi il cognome.';
    if (!first) return 'Scrivi il nome.';
    if (last.length > 60 || first.length > 60) return 'Nome o cognome troppo lungo (massimo 60 caratteri).';
    if (birth) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(birth) || Number.isNaN(Date.parse(birth))) return 'Data di nascita non valida.';
      if (birth > U.todayISO()) return 'La data di nascita è nel futuro.';
    }
    return '';
  },
  /** Studenti già in archivio con lo stesso nome e non distinguibili da data di nascita o alias. */
  matchCandidates({ firstName, lastName, birthDate, alias }, excludeId = null) {
    const key = U.normName(lastName + ' ' + firstName);
    return S.students.filter(s => s.id !== excludeId
      && U.normName(s.lastName + ' ' + s.firstName) === key
      && !(birthDate && s.birthDate && birthDate !== s.birthDate)
      && !(alias && s.alias && U.normName(alias) !== U.normName(s.alias)));
  },
  distinct(a, b) {
    return !!((a.birth && b.birth && a.birth !== b.birth) || (a.alias && b.alias && U.normName(a.alias) !== U.normName(b.alias)));
  },
  describe(st) {
    const parts = [st.birthDate ? `nato/a il ${U.fmtDate(st.birthDate)}` : 'data di nascita non indicata'];
    if (st.alias) parts.push(`alias ${st.alias}`);
    const cl = S.enrollments.filter(e => e.studentId === st.id).map(e => Q.cls(e.classId)).filter(Boolean);
    const uniq = [...new Map(cl.map(c => [c.id, c])).values()]
      .sort((a, b) => (Q.year(b.schoolYearId)?.label ?? '').localeCompare(Q.year(a.schoolYearId)?.label ?? ''));
    parts.push(uniq.length ? 'classi ' + uniq.map(c => `${c.name} (${Q.year(c.schoolYearId)?.label ?? '?'})`).join(', ') : 'nessuna classe');
    return parts.join(', ');
  },
  /** Verifica il vincolo: una sola iscrizione attiva per anno scolastico. */
  enrollStatus(studentId, classId) {
    const cls = Q.cls(classId);
    if (!cls) return { ok: false, reason: 'classe non trovata' };
    if (S.enrollments.some(e => e.studentId === studentId && e.classId === classId && !e.removedAt)) return { ok: false, reason: 'è già in questa classe' };
    const other = S.enrollments.find(e => e.studentId === studentId && !e.removedAt && Q.cls(e.classId)?.schoolYearId === cls.schoolYearId);
    if (other) return { ok: false, reason: `è già iscritto/a alla classe ${Q.cls(other.classId).name} in questo anno scolastico` };
    return { ok: true };
  },
  enroll(studentId, classId) {
    const st = Ops.enrollStatus(studentId, classId);
    if (!st.ok) return st;
    S.enrollments.push({ id: U.uid('e'), classId, studentId, addedAt: U.todayISO(), removedAt: null });
    return st;
  },
  createStudent({ firstName, lastName, birthDate, alias }) {
    const s = { id: U.uid('s'), firstName, lastName, birthDate: birthDate || null, alias: alias || '' };
    S.students.push(s);
    return s;
  },
  removeFromClass(studentId, classId) {
    const today = U.todayISO();
    S.enrollments.forEach(e => { if (e.studentId === studentId && e.classId === classId && !e.removedAt) e.removedAt = today; });
  },
  deleteStudent(studentId) {
    S.results = S.results.filter(r => r.studentId !== studentId);
    S.enrollments = S.enrollments.filter(e => e.studentId !== studentId);
    S.students = S.students.filter(s => s.id !== studentId);
  }
};

function openDialog(html, wide = false) {
  const d = document.getElementById('modal');
  d.onclick = d.oninput = d.onchange = d.onkeydown = null;
  d.className = wide ? 'wide' : '';
  d.innerHTML = html;
  d.returnValue = '';
  const closed = new Promise(res => d.addEventListener('close', () => res(d.returnValue), { once: true }));
  d.showModal();
  return { d, closed };
}
/** Collega i pulsanti [data-do] ai gestori; Invio in un campo di testo attiva il gestore enterKey. */
function wireDialog(d, handlers, enterKey = 'ok') {
  d.onclick = e => {
    const b = e.target.closest('[data-do]');
    if (!b || b.disabled) return;
    if (b.dataset.do === 'cancel') d.close('cancel');
    else if (handlers[b.dataset.do]) handlers[b.dataset.do](b, e);
  };
  d.onkeydown = e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && enterKey && handlers[enterKey]) { e.preventDefault(); handlers[enterKey](e.target, e); }
  };
}
const BTN_CANCEL = '<button type="button" class="btn ghost" data-do="cancel">Annulla</button>';

/** Aggiunta di un singolo studente. Restituisce {kind:'new', data} oppure {kind:'link', studentId} oppure null. */
async function dlgAddStudent(classId, opt = {}) {
  const cls = opt.name ? { name: opt.name } : Q.cls(classId);
  const statusOf = opt.statusFn || (id => Ops.enrollStatus(id, classId));
  let value = null, warnedDraft = false;
  const { d, closed } = openDialog('');

  const showForm = (v = {}) => {
    d.innerHTML = `<div class="modal-body"><h3 id="modalTitle">Aggiungi studente alla classe ${U.esc(cls.name)}</h3>
      ${studentFieldsHTML(v)}
      <p class="field-error" id="err" role="alert"></p>
      <div class="modal-actions">${BTN_CANCEL}<button type="button" class="btn primary" data-do="ok">Aggiungi</button></div></div>`;
    wireDialog(d, {
      ok: () => {
        const data = readStudentFields(d);
        const e = Ops.studentError(data.firstName, data.lastName, data.birthDate);
        if (e) { d.querySelector('#err').textContent = e; return; }
        const key = U.normName(data.lastName + ' ' + data.firstName);
        // Omonimo tra i nuovi della bozza: si avvisa solo se negli elenchi apparirebbero identici (stesso alias o data, oppure nessuno dei due)
        const tag = x => U.normName(x.alias || x.birth || '');
        const draftDup = (opt.extraNames || []).some(o => o.key === key && tag(o) === tag({ alias: data.alias, birth: data.birthDate || '' }));
        if (draftDup && !warnedDraft) {
          warnedDraft = true;
          d.querySelector('#err').textContent = 'Tra i nuovi studenti di questa classe ce n\'è già uno con lo stesso nome. Aggiungi data di nascita o alias per distinguerli, oppure premi di nuovo Aggiungi.';
          return;
        }
        const cands = Ops.matchCandidates(data);
        if (!cands.length) { value = { kind: 'new', data }; d.close('ok'); }
        else showMatch(data, cands);
      }
    });
    d.querySelector('#f_last').focus();
  };

  const showMatch = (data, cands) => {
    const noDist = !data.birthDate && !data.alias;
    d.innerHTML = `<div class="modal-body"><h3 id="modalTitle">Esiste già uno studente con questo nome</h3>
      <p>Stai aggiungendo <strong>${U.esc(data.lastName + ' ' + data.firstName)}</strong>. ${cands.length > 1 ? 'In archivio ci sono più studenti con lo stesso nome.' : 'In archivio c\'è uno studente con lo stesso nome.'} Si tratta della stessa persona?</p>
      ${cands.map(c => {
        const st = statusOf(c.id);
        return `<div class="cand"><strong>${U.esc(c.lastName + ' ' + c.firstName)}</strong><br><span class="small muted">${U.esc(Ops.describe(c))}</span>
          <div class="row" style="margin-top:8px"><button type="button" class="btn" data-do="link" data-id="${c.id}" ${st.ok ? '' : 'disabled'}>È lo stesso studente</button>
          ${st.ok ? '' : `<span class="small muted">Non collegabile: ${U.esc(st.reason)}.</span>`}</div></div>`;
      }).join('')}
      ${noDist ? '<div class="notice">Se è un altro studente, aggiungi la data di nascita o un alias: servono a distinguerli negli elenchi.</div>' : ''}
      <div class="modal-actions"><button type="button" class="btn ghost" data-do="back">Indietro</button>
        <button type="button" class="btn primary" data-do="new">${noDist ? 'Aggiungi comunque come nuovo studente' : 'È un altro studente'}</button></div></div>`;
    wireDialog(d, {
      back: () => showForm(data),
      link: b => { value = { kind: 'link', studentId: b.dataset.id }; d.close('ok'); },
      new: () => { value = { kind: 'new', data }; d.close('ok'); }
    }, null);
  };

  showForm();
  return (await closed) === 'ok' ? value : null;
}

/** Una riga per studente. Separatori ammessi: tabulazione o punto e virgola (da foglio di calcolo), virgola, oppure spazio (primo termine = cognome). */
function parseRoster(text) {
  const out = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.replace(/^\s*\d+\s*[.)\-:]?\s+/, '').trim();
    if (!line) continue;
    let last, first;
    if (/[\t;]/.test(line)) {
      const parts = line.split(/[\t;]/).map(s => s.trim()).filter(Boolean);
      last = parts[0]; first = parts.slice(1).join(' ');
    } else if (line.includes(',')) {
      const i = line.indexOf(',');
      last = line.slice(0, i).trim(); first = line.slice(i + 1).trim();
    } else {
      const t = line.split(/\s+/);
      last = t[0]; first = t.slice(1).join(' ');
    }
    out.push({ last: U.cleanName(last), first: U.cleanName(first), alias: '', birth: '', decision: null });
  }
  return out;
}
const isLink = r => !!(r.decision && r.decision.startsWith('link:'));
/** Calcola per ogni riga: errori, candidati in archivio, duplicati nell'elenco e se è risolta. */
function analyzeRoster(rows, classId, seed = []) {
  const statusOf = typeof classId === 'function' ? classId : (id => Ops.enrollStatus(id, classId));
  const linked = new Set();
  const seen = [...seed];
  rows.forEach(r => {
    r.err = ''; r.cands = []; r.dup = false; r.flag = false; r.resolved = false;
    if (r.decision === 'skip') return;
    if (!r.last || !r.first) { r.err = 'Servono cognome e nome.'; return; }
    if (r.last.length > 60 || r.first.length > 60) { r.err = 'Nome o cognome troppo lungo.'; return; }
    const key = U.normName(r.last + ' ' + r.first);
    r.cands = Ops.matchCandidates({ firstName: r.first, lastName: r.last, birthDate: r.birth || null, alias: r.alias })
      .map(s => ({ s, st: statusOf(s.id) }));
    r.dup = seen.some(o => o.key === key && !Ops.distinct(o, r));
    seen.push({ key, birth: r.birth, alias: r.alias });
    if (isLink(r)) {
      const id = r.decision.slice(5);
      const c = r.cands.find(c => c.s.id === id);
      if (!c || !c.st.ok) r.decision = null;
      else if (linked.has(id)) { r.decision = null; r.err = 'Questo studente è già collegato a un\'altra riga.'; }
      else linked.add(id);
    }
    r.flag = r.cands.length > 0 || r.dup;
    r.resolved = !r.err && (!r.flag || r.decision === 'new' || isLink(r));
  });
}
function rosterRowHTML(r, i) {
  const skipped = r.decision === 'skip';
  const cls = 'prow' + (skipped ? ' skipped' : r.err ? ' err' : (r.flag && !r.resolved) ? ' flag' : '');
  let html = `<div class="${cls}" data-i="${i}"><div class="prow-grid">
    <label class="field">Cognome<input type="text" data-f="last" value="${U.esc(r.last)}" ${skipped ? 'disabled' : ''}></label>
    <label class="field">Nome<input type="text" data-f="first" value="${U.esc(r.first)}" ${skipped ? 'disabled' : ''}></label>
    <button type="button" class="btn ghost" data-do="${skipped ? 'restore' : 'skip'}" data-i="${i}">${skipped ? 'Ripristina' : 'Togli'}</button></div>`;
  if (!skipped) {
    if (r.err) html += `<p class="field-error">${U.esc(r.err)}</p>`;
    if (r.flag) {
      html += `<p class="small" style="margin:8px 0 0"><strong>${r.cands.length ? 'Esiste già in archivio uno studente con questo nome.' : 'Questo nome compare più volte nell\'elenco.'}</strong></p>
        <select data-f="decision" aria-label="Come trattare questa riga"><option value="">Scegli cosa fare</option>
        ${r.cands.map(c => `<option value="link:${c.s.id}" ${r.decision === 'link:' + c.s.id ? 'selected' : ''} ${c.st.ok ? '' : 'disabled'}>Stesso studente: ${U.esc(Ops.describe(c.s))}${c.st.ok ? '' : ' (non collegabile: ' + U.esc(c.st.reason) + ')'}</option>`).join('')}
        <option value="new" ${r.decision === 'new' ? 'selected' : ''}>Nuovo studente (omonimo)</option></select>`;
      if (r.decision === 'new') {
        html += `<div class="form-grid" style="margin-top:8px">
          <label class="field">Alias (facoltativo)<input type="text" data-f="alias" value="${U.esc(r.alias)}" maxlength="40"></label>
          <label class="field">Data di nascita (facoltativa)<input type="date" data-f="birth" value="${U.esc(r.birth)}" max="${U.todayISO()}"></label></div>
          ${!r.birth && !r.alias ? '<p class="small muted" style="margin:6px 0 0">Per distinguerlo dagli omonimi è consigliato indicare l\'alias o la data di nascita.</p>' : ''}`;
      }
    }
  }
  return html + '</div>';
}

/** Restituisce l'elenco di operazioni confermate [{kind:'new', data} | {kind:'link', studentId}] oppure null. */
async function dlgImport(classId, opt = {}) {
  const cls = opt.name ? { name: opt.name } : Q.cls(classId);
  const target = opt.statusFn || classId, seed = opt.seed || [];
  let text = '', rows = [], items = null;
  const { d, closed } = openDialog('', true);

  const showText = (err = '') => {
    d.onchange = null;
    d.innerHTML = `<div class="modal-body"><h3 id="modalTitle">Aggiungi da elenco alla classe ${U.esc(cls.name)}</h3>
      <p class="small muted">Incolla l'elenco, una riga per studente, nel formato <strong>Cognome Nome</strong>. Funziona anche copiando da un foglio di calcolo o dal registro elettronico. Per i cognomi composti usa la virgola, per esempio <em>De Luca, Maria</em>. Nell'anteprima potrai correggere ogni riga.</p>
      <textarea id="f_text" spellcheck="false" placeholder="Rossi Marco&#10;Sanna Giulia&#10;De Luca, Maria">${U.esc(text)}</textarea>
      <p class="field-error" id="err" role="alert">${U.esc(err)}</p>
      <div class="modal-actions">${BTN_CANCEL}<button type="button" class="btn primary" data-do="preview">Anteprima</button></div></div>`;
    wireDialog(d, {
      preview: () => {
        text = d.querySelector('#f_text').value;
        rows = parseRoster(text);
        if (!rows.length) { d.querySelector('#err').textContent = 'Incolla almeno una riga.'; return; }
        if (rows.length > 150) { d.querySelector('#err').textContent = 'L\'elenco supera le 150 righe: dividilo in più parti.'; return; }
        showPreview();
      }
    }, null);
    d.querySelector('#f_text').focus();
  };

  const stats = () => {
    const live = rows.filter(r => r.decision !== 'skip');
    const ready = live.filter(r => r.resolved);
    const nLink = ready.filter(isLink).length;
    return { nLink, nNew: ready.length - nLink, skipped: rows.length - live.length, unresolved: live.length - ready.length, ready: ready.length };
  };
  const summaryText = s => `${s.nNew} nuovi, ${s.nLink} collegati a studenti già in archivio` + (s.skipped ? `, ${s.skipped} tolti` : '') + (s.unresolved ? `, ${s.unresolved} da sistemare` : '');
  const updateSummary = () => {
    const s = stats();
    d.querySelector('#sum').textContent = summaryText(s);
    const ok = d.querySelector('[data-do="ok"]');
    ok.disabled = s.unresolved > 0 || s.ready === 0;
    ok.textContent = `Aggiungi ${s.ready} ${s.ready === 1 ? 'studente' : 'studenti'}`;
  };
  const sig = () => rows.map(r => [r.flag, r.resolved, r.err, r.dup, r.cands.length, r.decision].join(',')).join('|');

  const showPreview = () => {
    const scroll = d.scrollTop;
    analyzeRoster(rows, target, seed);
    const s = stats();
    d.innerHTML = `<div class="modal-body"><h3 id="modalTitle">Anteprima: classe ${U.esc(cls.name)}</h3>
      <div class="sumbar"><span id="sum" aria-live="polite">${U.esc(summaryText(s))}</span></div>
      ${rows.map(rosterRowHTML).join('')}
      <div class="modal-actions"><button type="button" class="btn ghost" data-do="back">Indietro</button>
        <button type="button" class="btn primary" data-do="ok" ${s.unresolved > 0 || s.ready === 0 ? 'disabled' : ''}>Aggiungi ${s.ready} ${s.ready === 1 ? 'studente' : 'studenti'}</button></div></div>`;
    wireDialog(d, {
      back: () => showText(),
      skip: b => { rows[Number(b.dataset.i)].decision = 'skip'; showPreview(); },
      restore: b => { rows[Number(b.dataset.i)].decision = null; showPreview(); },
      ok: () => {
        analyzeRoster(rows, target, seed);
        items = rows.filter(r => r.decision !== 'skip' && r.resolved).map(r => isLink(r)
          ? { kind: 'link', studentId: r.decision.slice(5) }
          : { kind: 'new', data: { firstName: r.first, lastName: r.last, birthDate: r.birth || null, alias: r.alias || '' } });
        d.close('ok');
      }
    }, null);
    d.onchange = e => {
      const rowEl = e.target.closest('.prow');
      if (!rowEl) return;
      const r = rows[Number(rowEl.dataset.i)], f = e.target.dataset.f;
      if (!r || !f) return;
      const before = sig();
      if (f === 'last' || f === 'first') { r[f] = U.cleanName(e.target.value); e.target.value = r[f]; }
      else if (f === 'alias') r.alias = e.target.value.replace(/\s+/g, ' ').trim();
      else if (f === 'birth') r.birth = e.target.value || '';
      else if (f === 'decision') r.decision = e.target.value || null;
      analyzeRoster(rows, target, seed);
      if (f === 'decision' || sig() !== before) showPreview(); else updateSummary();
    };
    d.scrollTop = scroll;
  };

  showText();
  return (await closed) === 'ok' ? items : null;
}

/* ==========================================================

Object.assign(Ops, {
  paramUsage(id) {
    const sess = S.sessions.filter(s => s.parameterId === id);
    const ids = new Set(sess.map(s => s.id));
    return { sessions: sess.length, results: S.results.filter(r => ids.has(r.sessionId)).length };
  },
  paramInUse(id) { const u = Ops.paramUsage(id); return u.sessions > 0 || u.results > 0; },
  paramNameError(name, exceptId = null) {
    if (!name) return 'Scrivi il nome del parametro.';
    if (name.length > 40) return 'Il nome è troppo lungo (massimo 40 caratteri).';
    const k = U.normName(name);
    if (S.parameters.some(p => p.id !== exceptId && U.normName(p.name) === k)) return 'Esiste già un parametro con questo nome (anche tra gli archiviati).';
    return '';
  },
  nextParamOrder() { return S.parameters.reduce((m, p) => Math.max(m, p.order), 0) + 1; }
});

/** Porta ai nomi attuali i parametri predefiniti salvati con il nome precedente. Restituisce true se ha modificato qualcosa. */
function migrateNames() {
  let changed = false;
  S.parameters.forEach(p => {
    if (p.id === 'pLungo' && p.name === 'Salto in lungo da fermo') { p.name = 'Salto in lungo'; changed = true; }
  });
  return changed;
}

const PARAM_TYPES = { tempo: 'Tempo', distanza: 'Distanza', conteggio: 'Conteggio' };
const PARAM_DEFAULTS = {
  tempo: { unit: 's', betterWhen: 'lower', decimals: 2 },
  distanza: { unit: 'm', betterWhen: 'higher', decimals: 2 },
  conteggio: { unit: 'rip', betterWhen: 'higher', decimals: 0 }
};

/** Finestra di creazione o modifica. Se il parametro è in uso si può cambiare solo il nome. */
async function dlgParam(p) {
  const usage = p ? Ops.paramUsage(p.id) : null;
  const locked = !!(usage && (usage.sessions || usage.results));
  const v = p || { name: '', type: 'tempo', ...PARAM_DEFAULTS.tempo, attempts: 3, requiresEquipmentWeight: false };
  const dis = locked ? 'disabled' : '';
  const opt = (val, label, cur) => `<option value="${val}" ${String(val) === String(cur) ? 'selected' : ''}>${label}</option>`;
  const { d, closed } = openDialog(`<div class="modal-body"><h3 id="modalTitle">${p ? 'Modifica parametro' : 'Nuovo parametro'}</h3>
    ${locked ? `<div class="notice">Questo parametro è già in uso (${usage.sessions} ${usage.sessions === 1 ? 'sessione' : 'sessioni'}, ${usage.results} risultati). Si può cambiare solo il nome: unità, direzione, decimali, prove e peso attrezzo sono bloccati per non alterare lo storico. Per cambiarli, crea un nuovo parametro e archivia questo.</div>` : ''}
    <label class="field">Nome<input type="text" id="f_name" value="${U.esc(v.name)}" maxlength="40" autocomplete="off" placeholder="es. Salto triplo"></label>
    <div class="form-grid" style="margin-top:12px">
      <label class="field">Tipo<select id="f_type" ${dis}>${Object.entries(PARAM_TYPES).map(([k, l]) => opt(k, l, v.type)).join('')}</select></label>
      <label class="field">Unità di misura<input type="text" id="f_unit" value="${U.esc(v.unit)}" maxlength="12" autocomplete="off" ${dis}></label>
      <label class="field">Il risultato migliore è<select id="f_better" ${dis}>${opt('lower', 'il più basso', v.betterWhen)}${opt('higher', 'il più alto', v.betterWhen)}</select></label>
      <label class="field">Decimali<select id="f_dec" ${dis}>${[0, 1, 2, 3].map(n => opt(n, n, v.decimals)).join('')}</select></label>
      <label class="field">Prove per sessione<input type="number" id="f_att" min="1" max="10" step="1" inputmode="numeric" value="${v.attempts}" ${dis}></label>
      <label class="field check"><input type="checkbox" id="f_eq" ${v.requiresEquipmentWeight ? 'checked' : ''} ${dis}>Richiede il peso dell'attrezzo</label>
    </div>
    <p class="field-error" id="err" role="alert"></p>
    <div class="modal-actions">${BTN_CANCEL}<button type="button" class="btn primary" data-do="ok">${p ? 'Salva' : 'Aggiungi parametro'}</button></div></div>`);
  let out = null;
  const q = s => d.querySelector(s);
  if (!p) {
    // Nuovo parametro: scegliendo il tipo si propongono unità, direzione e decimali tipici
    d.onchange = e => {
      if (e.target.id !== 'f_type') return;
      const df = PARAM_DEFAULTS[e.target.value];
      q('#f_unit').value = df.unit; q('#f_better').value = df.betterWhen; q('#f_dec').value = String(df.decimals);
    };
  }
  wireDialog(d, {
    ok: () => {
      const err = q('#err');
      const name = q('#f_name').value.replace(/\s+/g, ' ').trim();
      const en = Ops.paramNameError(name, p ? p.id : null);
      if (en) { err.textContent = en; q('#f_name').focus(); return; }
      if (locked) { out = { name }; d.close('ok'); return; }
      const unit = q('#f_unit').value.trim();
      if (!unit) { err.textContent = 'Indica l\'unità di misura, per esempio s, m o cm.'; q('#f_unit').focus(); return; }
      const attempts = Number(q('#f_att').value);
      if (!Number.isInteger(attempts) || attempts < 1 || attempts > 10) { err.textContent = 'Le prove per sessione devono essere un numero intero da 1 a 10.'; q('#f_att').focus(); return; }
      out = {
        name, unit, attempts,
        type: q('#f_type').value, betterWhen: q('#f_better').value,
        decimals: Number(q('#f_dec').value), requiresEquipmentWeight: q('#f_eq').checked
      };
      d.close('ok');
    }
  });
  q('#f_name').focus();
  return (await closed) === 'ok' ? out : null;
}

/* ==========================================================
   M4: sessioni di test
   ========================================================== */
U.inputNum = v => (v === null || v === undefined) ? '' : String(v).replace('.', ',');
U.fmtKg = w => Number(w).toLocaleString('it-IT', { maximumFractionDigits: 2 });
U.decimalsOf = raw => (String(raw).trim().replace(',', '.').split('.')[1] || '').length;

/** Nome breve per la barra degli studenti; agli omonimi aggiunge alias o anno di nascita. */
Q.shortName = function (st, counts = Q.homonymCounts()) {
  if (!Q.isHomonym(st, counts)) return `${st.lastName} ${st.firstName.charAt(0)}.`;
  const tag = st.alias || (st.birthDate ? st.birthDate.slice(0, 4) : '');
  return `${st.lastName} ${st.firstName}${tag ? ` (${tag})` : ''}`;
};

Object.assign(Ops, {
  resultOf(sesId, stId) { return S.results.find(r => r.sessionId === sesId && r.studentId === stId); },
  deleteResult(id) { S.results = S.results.filter(r => r.id !== id); },
  sessionExists(classId, parameterId, date, exceptId = null) {
    return S.sessions.find(s => s.id !== exceptId && s.classId === classId && s.parameterId === parameterId && s.date === date);
  },
  /** Ultimo peso attrezzo usato dalla classe per quel test, da proporre nella nuova sessione. */
  lastWeight(classId, parameterId) {
    const s = S.sessions.filter(x => x.classId === classId && x.parameterId === parameterId && x.equipmentWeightKg != null)
      .sort((a, b) => b.date.localeCompare(a.date))[0];
    return s ? s.equipmentWeightKg : null;
  },
  weightError(raw) {
    const n = U.parseNum(raw);
    if (n === null) return 'Indica il peso dell\'attrezzo in kg.';
    if (Number.isNaN(n) || n <= 0) return 'Il peso dell\'attrezzo deve essere un numero maggiore di zero, per esempio 3 oppure 2,5.';
    if (U.decimalsOf(raw) > 2) return 'Per il peso dell\'attrezzo usa al massimo 2 decimali.';
    if (n > 50) return 'Il peso sembra troppo alto: controlla che sia in kg.';
    return '';
  },
  dateError(date) {
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(Date.parse(date))) return 'Indica una data valida.';
    if (date > U.todayISO()) return 'La data non può essere nel futuro.';
    return '';
  },
  createSession({ classId, parameterId, date, equipmentWeightKg }) {
    const s = { id: U.uid('ses'), classId, parameterId, date, equipmentWeightKg: equipmentWeightKg ?? null };
    S.sessions.push(s);
    return s;
  },
  /** Cambia la data: i risultati registrati nel giorno della sessione la seguono, i recuperi mantengono la loro data. */
  changeSessionDate(ses, newDate) {
    S.results.forEach(r => { if (r.sessionId === ses.id && r.measuredOn === ses.date) r.measuredOn = newDate; });
    ses.date = newDate;
  },
  deleteSession(id) {
    S.results = S.results.filter(r => r.sessionId !== id);
    S.sessions = S.sessions.filter(s => s.id !== id);
  },
  /** Errore di una singola prova, '' se valida o vuota. */
  trialError(raw, p) {
    const n = U.parseNum(raw);
    if (n === null) return '';
    if (Number.isNaN(n)) return 'non è un numero valido';
    if (n < 0) return 'non può essere negativo';
    if (n === 0 && p.type !== 'conteggio') return 'deve essere maggiore di zero; se la prova è nulla lascia il campo vuoto';
    if (U.decimalsOf(raw) > p.decimals) return p.decimals === 0 ? 'deve essere un numero intero' : `usa al massimo ${p.decimals} ${p.decimals === 1 ? 'decimale' : 'decimali'}`;
    if (n > 100000) return 'il valore è troppo grande';
    return '';
  },
  /** Registra le prove; senza prove valide un risultato "misurato" torna "da registrare". */
  setTrials(ses, stId, trials) {
    const p = Q.param(ses.parameterId);
    let r = Ops.resultOf(ses.id, stId);
    const any = trials.some(t => typeof t === 'number');
    if (!any) {
      if (r && r.status === 'misurato') Ops.deleteResult(r.id);
      return r && r.status !== 'misurato' ? r : null;
    }
    if (!r) { r = { id: U.uid('r'), sessionId: ses.id, studentId: stId, status: 'misurato', trials: [], value: null, measuredOn: ses.date }; S.results.push(r); }
    if (r.status !== 'misurato' || !r.measuredOn) r.measuredOn = ses.date;
    r.status = 'misurato';
    r.trials = Array.from({ length: p.attempts }, (_, i) => typeof trials[i] === 'number' ? trials[i] : null);
    r.value = U.bestOf(r.trials, p.betterWhen);
    return r;
  },
  setStatus(ses, stId, status) {
    const p = Q.param(ses.parameterId);
    let r = Ops.resultOf(ses.id, stId);
    if (!r) { r = { id: U.uid('r'), sessionId: ses.id, studentId: stId }; S.results.push(r); }
    Object.assign(r, { status, trials: Array(p.attempts).fill(null), value: null, measuredOn: null });
    return r;
  },
  previousResult(stId, paramId, beforeDate) {
    return S.results.filter(r => r.studentId === stId && r.status === 'misurato')
      .map(r => ({ r, ses: Q.session(r.sessionId) }))
      .filter(x => x.ses && x.ses.parameterId === paramId && x.ses.date < beforeDate)
      .sort((a, b) => b.ses.date.localeCompare(a.ses.date))[0] || null;
  }
});

/** Studenti di una sessione: gli iscritti attivi più chi ha già un risultato (anche se poi uscito). */
function sessionRoster(ses) {
  const ids = new Set(Q.activeEnrollments(ses.classId).map(e => e.studentId));
  Q.resultsOfSession(ses.id).forEach(r => ids.add(r.studentId));
  return [...ids].map(id => Q.student(id)).filter(Boolean).sort(U.byName);
}
const resultState = r => !r ? 'todo' : r.status === 'misurato' ? 'done' : r.status;
const STATE_LABEL = { todo: 'da registrare', done: 'misurato', assente: 'assente', esonerato: 'esonerato' };

let SesCtx = null;      // contesto della scheda di inserimento aperta
let saveTimer = null;   // salvataggio differito durante la digitazione
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; commit(); }, 500);
}
async function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await commit(); }
}

function sessionHeadHTML(ses, p, c) {
  return `<p class="small" style="margin:0 0 4px"><a href="#/classe/${c.id}/sessioni">Classe ${U.esc(c.name)}</a></p>
    <h2>${U.esc(p.name)}</h2>
    <p class="sub">${U.fmtDate(ses.date)}, ${p.attempts} ${p.attempts === 1 ? 'prova' : 'prove'} in ${U.esc(p.unit)}, migliore se ${p.betterWhen === 'lower' ? 'più basso' : 'più alto'}${ses.equipmentWeightKg != null ? `, attrezzo da ${U.fmtKg(ses.equipmentWeightKg)} kg` : ''}</p>`;
}
function sessionProgress(ses, roster) {
  const done = roster.filter(s => Ops.resultOf(ses.id, s.id)).length;
  return `${done} di ${roster.length} registrati`;
}

function viewSessione(id, mode, studentId) {
  const ses = Q.session(id);
  if (!ses) return viewNotFound();
  const p = Q.param(ses.parameterId), c = Q.cls(ses.classId);
  if (!p || !c) return viewNotFound();
  const roster = sessionRoster(ses);
  if (mode === 'riepilogo') return viewSessionSummary(ses, p, c, roster);
  if (!roster.length) return sessionHeadHTML(ses, p, c) + `<div class="panel empty"><strong>La classe non ha studenti</strong>Aggiungi gli studenti alla classe ${U.esc(c.name)} e torna qui.</div>`;

  let idx = studentId ? roster.findIndex(s => s.id === studentId) : -1;
  if (idx < 0) { idx = roster.findIndex(s => !Ops.resultOf(ses.id, s.id)); if (idx < 0) idx = 0; }
  const st = roster[idx];
  const r = Ops.resultOf(ses.id, st.id);
  const state = resultState(r);
  SesCtx = { sesId: ses.id, studentId: st.id, idx, ids: roster.map(s => s.id) };
  const counts = Q.homonymCounts();
  const blocked = state === 'assente' || state === 'esonerato';
  const trials = r && r.status === 'misurato' ? r.trials : [];
  const firstEmpty = blocked ? -1 : Math.max(0, Array.from({ length: p.attempts }, (_, i) => trials[i]).findIndex(v => v == null));
  const prev = Ops.previousResult(st.id, p.id, ses.date);
  const n = roster.length;

  const inputs = Array.from({ length: p.attempts }, (_, i) => `<label class="field">Prova ${i + 1}
      <input type="text" data-trial="${i}" inputmode="${p.decimals ? 'decimal' : 'numeric'}" enterkeyhint="${i === p.attempts - 1 ? 'done' : 'next'}" autocomplete="off"
        value="${U.esc(U.inputNum(trials[i]))}" aria-label="Prova ${i + 1} in ${U.esc(p.unit)}" ${blocked ? 'disabled' : ''} ${i === firstEmpty ? 'data-autofocus' : ''}></label>`).join('');

  let prevHTML = '';
  if (prev) {
    const wNote = prev.ses.equipmentWeightKg != null && prev.ses.equipmentWeightKg !== ses.equipmentWeightKg ? `, con attrezzo da ${U.fmtKg(prev.ses.equipmentWeightKg)} kg` : '';
    prevHTML = `<p class="small muted" style="margin:0">Risultato precedente: ${U.fmtNum(prev.r.value, p.decimals)} ${U.esc(p.unit)} il ${U.fmtDate(prev.ses.date)}${wNote}</p>`;
  }

  return sessionHeadHTML(ses, p, c) + `
    <div class="row" style="margin-bottom:6px"><span class="small muted" id="sesProgress">${sessionProgress(ses, roster)}</span></div>
    <div class="strip" aria-label="Studenti della sessione">${roster.map((s, i) => {
      const k = resultState(Ops.resultOf(ses.id, s.id));
      return `<button type="button" class="chip ${k}" data-action="sesJump" data-student="${s.id}" ${i === idx ? 'aria-current="true"' : ''}><span class="dot" aria-hidden="true"></span>${U.esc(Q.shortName(s, counts))}<span class="sr">, ${STATE_LABEL[k]}</span></button>`;
    }).join('')}</div>
    <div class="entry">
      <div class="entry-head"><span class="entry-bib" aria-hidden="true">${idx + 1}</span>
        <div><div class="entry-name">${U.esc(Q.displayName(st, counts))}</div>
        <div class="small muted">Studente ${idx + 1} di ${n}${r && Q.isRecovery(r) ? `, recuperato il ${U.fmtDate(r.measuredOn)}` : ''}</div></div></div>
      ${prevHTML}
      ${blocked ? `<div class="notice" style="margin:10px 0 0">${state === 'assente' ? 'Segnato come assente: la prova comparirà tra i recuperi.' : 'Segnato come esonerato.'} Per inserire le prove, togli prima ${state === 'assente' ? 'l\'assenza' : 'l\'esonero'}.</div>` : ''}
      <div class="trials">${inputs}</div>
      <p class="best">Migliore: <strong id="best">${r && r.status === 'misurato' ? U.fmtNum(r.value, p.decimals) : '—'}</strong> ${U.esc(p.unit)}</p>
      <p class="field-error" id="trialErr" role="alert"></p>
      <div class="row">
        <button type="button" class="btn" data-action="sesStatus" data-status="assente" aria-pressed="${state === 'assente'}">Assente</button>
        <button type="button" class="btn" data-action="sesStatus" data-status="esonerato" aria-pressed="${state === 'esonerato'}">Esonerato</button>
      </div>
      <div class="entry-nav">
        <button type="button" class="btn" data-action="sesMove" data-dir="-1" ${idx === 0 ? 'disabled' : ''}>Precedente</button>
        <button type="button" class="btn primary" data-action="sesMove" data-dir="1">${idx === n - 1 ? 'Vai al riepilogo' : 'Salva e avanti'}</button>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button type="button" class="btn ghost" data-action="sesMove" data-dir="summary">Riepilogo della sessione</button>
      <button type="button" class="btn ghost" data-action="sesEdit" data-session="${ses.id}">Modifica sessione</button>
    </div>`;
}

function viewSessionSummary(ses, p, c, roster) {
  const counts = Q.homonymCounts();
  const rows = roster.map(s => ({ s, r: Ops.resultOf(ses.id, s.id) }));
  const cnt = k => rows.filter(x => resultState(x.r) === k).length;
  const todo = cnt('todo');

/* ---------- Lettura e salvataggio delle prove ---------- */
function trialInputs() { return [...document.querySelectorAll('#main [data-trial]')]; }
function readTrials(p, inputs) {
  const vals = []; let error = '', bad = -1;
  inputs.forEach((inp, i) => {
    const raw = inp.value.trim();
    const e = raw ? Ops.trialError(raw, p) : '';
    if (e) { if (bad < 0) { bad = i; error = `Prova ${i + 1}: ${e}.`; } vals.push(null); }
    else vals.push(raw ? U.parseNum(raw) : null);
  });
  return { vals, error, bad };
}
function markInvalid(p, inputs) {
  inputs.forEach(inp => {
    const raw = inp.value.trim();
    if (raw && Ops.trialError(raw, p)) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
  });
}
/** Salva lo studente corrente. Con strict=true un valore non valido blocca e viene segnalato. */
async function saveCurrent(strict) {
  if (!SesCtx) return true;
  const ses = Q.session(SesCtx.sesId), p = ses && Q.param(ses.parameterId);
  if (!ses || !p) return true;
  const inputs = trialInputs();
  if (!inputs.length || inputs[0].disabled) { await flushSave(); return true; }
  const { vals, error, bad } = readTrials(p, inputs);
  if (error) {
    if (strict) { markInvalid(p, inputs); document.getElementById('trialErr').textContent = error; inputs[bad].focus(); }
    return false;
  }
  Ops.setTrials(ses, SesCtx.studentId, vals);
  clearTimeout(saveTimer); saveTimer = null;
  await commit();
  return true;
}
/** Durante la digitazione: aggiorna il migliore e salva in differita, senza mostrare errori a metà valore. */
function onTrialInput() {
  if (!SesCtx) return;
  const ses = Q.session(SesCtx.sesId), p = Q.param(ses.parameterId);
  const inputs = trialInputs();
  const { vals, error } = readTrials(p, inputs);
  const best = U.bestOf(vals, p.betterWhen);
  document.getElementById('best').textContent = best == null ? '—' : U.fmtNum(best, p.decimals);
  if (error) return;
  document.getElementById('trialErr').textContent = '';
  inputs.forEach(i => i.removeAttribute('aria-invalid'));
  const r = Ops.setTrials(ses, SesCtx.studentId, vals);
  const chip = document.querySelector('.chip[aria-current="true"]');
  if (chip) chip.className = 'chip ' + resultState(r);
  const pr = document.getElementById('sesProgress');
  if (pr) pr.textContent = sessionProgress(ses, sessionRoster(ses));
  scheduleSave();
}
/** Uscendo da un campo si mostra subito l'eventuale errore di quel campo. */
function onTrialBlur(inp) {

Object.assign(Ops, {
  recoveryDateError(date, ses) {
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(Date.parse(date))) return 'Indica la data del recupero.';
    if (date > U.todayISO()) return 'La data del recupero non può essere nel futuro.';
    if (date < ses.date) return `La data del recupero non può essere precedente alla sessione (${U.fmtDate(ses.date)}).`;
    return '';
  },
  /** Trasforma un'assenza in risultato misurato: stesso risultato, stessa sessione, data di misura = data del recupero. */
  recordRecovery(ses, result, trials, date) {
    const p = Q.param(ses.parameterId);
    result.status = 'misurato';
    result.trials = Array.from({ length: p.attempts }, (_, i) => typeof trials[i] === 'number' ? trials[i] : null);
    result.value = U.bestOf(result.trials, p.betterWhen);
    result.measuredOn = date;

});
