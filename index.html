U.fmtSigned = function (v, dec = 2) {
  const s = Math.abs(v).toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return (v > 0 ? '+' : v < 0 ? '\u2212' : '') + s;
};
const n1 = v => Math.round(v * 10) / 10;
const pad2 = n => String(n).padStart(2, '0');
const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };

let StudView = { studentId: null, yearId: 'all' };   // filtro "Periodo" della scheda studente
const ProgSel = {};                                  // test scelto nella scheda Progressi, per classe
let lastChartW = 0;

const Prog = {
  /** Misure valide di uno studente per un test, in ordine cronologico di sessione. yearId = 'all' oppure l'id di un anno. */
  points(studentId, paramId, yearId = 'all') {
    const out = [];
    for (const r of S.results) {
      if (r.studentId !== studentId || r.status !== 'misurato' || typeof r.value !== 'number') continue;
      const ses = Q.session(r.sessionId);
      if (!ses || ses.parameterId !== paramId) continue;
      const cls = Q.cls(ses.classId);
      if (!cls || (yearId !== 'all' && cls.schoolYearId !== yearId)) continue;
      out.push({ r, ses, cls, yearId: cls.schoolYearId, value: r.value, date: ses.date, measuredOn: r.measuredOn, weight: ses.equipmentWeightKg,
        recovery: !!(r.measuredOn && r.measuredOn !== ses.date) });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date) || String(a.measuredOn).localeCompare(String(b.measuredOn)));
  },
  /** Variazione tra prima e ultima misura. verdict: better | worse | same, secondo la direzione del test. */
  trend(pts, p) {
    if (!pts.length) return null;
    const first = pts[0], last = pts[pts.length - 1];
    const t = { n: pts.length, first, last, single: pts.length === 1 };
    if (t.single) return t;
    t.diff = U.round(last.value - first.value, p.decimals);
    t.pct = first.value !== 0 ? (t.diff / first.value) * 100 : null;
    t.verdict = t.diff === 0 ? 'same' : ((p.betterWhen === 'lower') === (t.diff < 0) ? 'better' : 'worse');
    t.weightChanged = !!p.requiresEquipmentWeight && first.weight !== last.weight;
    return t;
  }
};

function niceTicks(min, max, count, maxDec, minStep = 0) {
  const raw = (max - min) / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const norm = raw / mag;
  let step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  if (step < minStep) step = minStep;
  const lo = Math.floor(min / step + 1e-9) * step, hi = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(U.round(v, 8));
  const dec = Math.min(maxDec, Math.max(0, Math.ceil(-Math.log10(step) - 1e-9)));
  return { lo: ticks[0], hi: ticks[ticks.length - 1], ticks, dec };
}

function chartWidth() {
  const m = document.getElementById('main');
  const w = (m && m.clientWidth) || 380;
  return Math.max(280, Math.min(720, w - 32 - 22));
}

/** Un segnaposto per ogni anno scolastico con dati: gli anni occupano la stessa larghezza, l'estate non occupa spazio. */
function schoolSlots(pts) {
  const map = new Map();
  pts.forEach(pt => {
    if (map.has(pt.yearId)) return;
    const label = Q.year(pt.yearId)?.label ?? '';
    map.set(pt.yearId, { yearId: pt.yearId, label, startYear: parseInt(label, 10) || Number(pt.date.slice(0, 4)) });
  });
  return [...map.values()].sort((a, b) => a.startYear - b.startYear || a.label.localeCompare(b.label));
}

const MONTHS = [[9, 'Set'], [10, 'Ott'], [11, 'Nov'], [12, 'Dic'], [1, 'Gen'], [2, 'Feb'], [3, 'Mar'], [4, 'Apr'], [5, 'Mag'], [6, 'Giu']];

/** Segno del punto. La forma distingue il peso dell'attrezzo, il simbolo vuoto distingue il recupero. */
function marker(shape, x, y, hollow) {
  x = n1(x); y = n1(y);
  const c = `class="mk${hollow ? ' hollow' : ''}"`;
  if (shape === 1) return `<rect ${c} x="${n1(x - 4.5)}" y="${n1(y - 4.5)}" width="9" height="9"/>`;
  if (shape === 2) return `<path ${c} d="M${x} ${n1(y - 6)}L${n1(x + 5.5)} ${n1(y + 4.5)}L${n1(x - 5.5)} ${n1(y + 4.5)}Z"/>`;
  if (shape === 3) return `<path ${c} d="M${x} ${n1(y - 6)}L${n1(x + 6)} ${y}L${x} ${n1(y + 6)}L${n1(x - 6)} ${y}Z"/>`;
  return `<circle ${c} cx="${x}" cy="${y}" r="5"/>`;
}

function chartHTML(p, pts, studentId) {
  const W = chartWidth(), H = 250;
  lastChartW = W;
  const M = { l: p.decimals > 0 ? 48 : 42, r: 14, t: 14, b: 38 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const vals = pts.map(x => x.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.14 || Math.abs(hi) * 0.06 || 1;
  const yt = niceTicks(lo - pad, hi + pad, 4, p.decimals, p.decimals === 0 ? 1 : 0);
  const yOf = v => M.t + ph - ((v - yt.lo) / (yt.hi - yt.lo)) * ph;
  const slots = schoolSlots(pts);
  const slotW = pw / slots.length, inset = 10;
  const idx = new Map(slots.map((s, i) => [s.yearId, i]));
  const span = s => [dayNum(`${s.startYear}-09-01`), dayNum(`${s.startYear + 1}-06-30`)];
  const xDay = (day, s, i) => { const [a, b] = span(s); const f = Math.min(1, Math.max(0, (day - a) / (b - a))); return M.l + i * slotW + inset + f * (slotW - 2 * inset); };
  pts.forEach(pt => { const i = idx.get(pt.yearId); pt.x = xDay(dayNum(pt.date), slots[i], i); pt.y = yOf(pt.value); });

  let g = '';
  slots.forEach((s, i) => { if (i % 2 === 1) g += `<rect class="band" x="${n1(M.l + i * slotW)}" y="${M.t}" width="${n1(slotW)}" height="${ph}"/>`; });
  yt.ticks.forEach(v => {
    const y = n1(yOf(v));
    g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}"/><text class="axl" x="${M.l - 6}" y="${n1(y + 4)}" text-anchor="end">${U.fmtNum(v, yt.dec)}</text>`;
  });
  if (slots.length === 1) {
    const s = slots[0], [, endDay] = span(s);
    MONTHS.forEach(([mo, name], k) => {
      const yr = mo >= 9 ? s.startYear : s.startYear + 1;
      const next = MONTHS[k + 1];
      const d0 = dayNum(`${yr}-${pad2(mo)}-01`);
      const d1 = next ? dayNum(`${next[0] >= 9 ? s.startYear : s.startYear + 1}-${pad2(next[0])}-01`) : endDay;
      const xa = xDay(d0, s, 0), xb = xDay(d1, s, 0);
      if (k > 0) g += `<line class="grid" x1="${n1(xa)}" x2="${n1(xa)}" y1="${M.t}" y2="${M.t + ph}"/>`;
      g += `<text class="axl" x="${n1((xa + xb) / 2)}" y="${H - 20}" text-anchor="middle">${name}</text>`;
    });
    g += `<text class="axl yr" x="${n1(M.l + pw / 2)}" y="${H - 5}" text-anchor="middle">${U.esc(s.label)}</text>`;
  } else {
    slots.forEach((s, i) => {
      if (i > 0) g += `<line class="sep" x1="${n1(M.l + i * slotW)}" x2="${n1(M.l + i * slotW)}" y1="${M.t}" y2="${M.t + ph}"/>`;
      g += `<text class="axl yr" x="${n1(M.l + i * slotW + slotW / 2)}" y="${H - 8}" text-anchor="middle">${U.esc(s.label)}</text>`;
    });
  }
  g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${M.t + ph}" y2="${M.t + ph}"/>`;
  if (pts.length > 1) g += `<polyline class="line" points="${pts.map(pt => `${n1(pt.x)},${n1(pt.y)}`).join(' ')}"/>`;

  const weights = p.requiresEquipmentWeight ? [...new Set(pts.map(x => x.weight).filter(w => w != null))].sort((a, b) => a - b) : [];
  const shapeOf = w => weights.length > 1 ? weights.indexOf(w) % 4 : 0;
  pts.forEach(pt => {
    const label = `${U.fmtDate(pt.date)}: ${U.fmtNum(pt.value, p.decimals)} ${p.unit}${pt.recovery ? ', recupero' : ''}${pt.weight != null && p.requiresEquipmentWeight ? `, attrezzo da ${U.fmtKg(pt.weight)} kg` : ''}`;
    g += `<g class="pt" tabindex="0" role="button" data-action="showPoint" data-result="${pt.r.id}" data-student="${studentId}" aria-label="${U.esc(label)}">
      <circle class="hit" cx="${n1(pt.x)}" cy="${n1(pt.y)}" r="17"/>${marker(shapeOf(pt.weight), pt.x, pt.y, pt.recovery)}</g>`;
  });

  const hasRec = pts.some(x => x.recovery);
  const icon = (shape, hollow) => `<svg viewBox="0 0 14 14" aria-hidden="true">${marker(shape, 7, 7, hollow)}</svg>`;
  let leg = '';
  if (weights.length > 1) weights.forEach((w, i) => { leg += `<span>${icon(i % 4, false)}Attrezzo da ${U.fmtKg(w)} kg</span>`; });
  else if (hasRec) leg += `<span>${icon(0, false)}Misura nel giorno della sessione</span>`;
  if (hasRec) leg += `<span>${icon(0, true)}Recupero (simbolo vuoto)</span>`;

  const first = pts[0], last = pts[pts.length - 1];
  const aria = `Grafico dell'andamento, ${pts.length} ${pts.length === 1 ? 'misura' : 'misure'}, da ${U.fmtNum(first.value, p.decimals)} a ${U.fmtNum(last.value, p.decimals)} ${p.unit}. I dati sono anche nella tabella sotto il grafico.`;
  return `<div class="chartbox chart"><svg class="plot" viewBox="0 0 ${W} ${H}" role="group" aria-label="${U.esc(aria)}" focusable="false">${g}</svg>
    ${leg ? `<div class="legend">${leg}</div>` : ''}
    <div class="pt-info" aria-live="polite">Tocca un punto per vedere le prove di quella sessione.</div></div>`;
}

function pointInfoHTML(r, ses, p, studentId) {
  const trials = r.trials.map(t => t === null ? '–' : U.fmtNum(t, p.decimals)).join(' / ');
  return `<strong>Sessione del ${U.fmtDate(ses.date)}</strong>: migliore ${U.fmtNum(r.value, p.decimals)} ${U.esc(p.unit)} (prove ${trials})`
    + `${p.requiresEquipmentWeight && ses.equipmentWeightKg != null ? `, attrezzo da ${U.fmtKg(ses.equipmentWeightKg)} kg` : ''}`
    + `${r.measuredOn && r.measuredOn !== ses.date ? `, recuperata il ${U.fmtDate(r.measuredOn)}` : ''}. <a href="#/sessione/${ses.id}/s/${studentId}">Apri la sessione</a>`;
}

const ARROW = {
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>', flat: '<path d="M5 12h14"/>'
};
const arrowSVG = diff => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ARROW[diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat']}</svg>`;
const VERDICT = { better: 'Migliorato', worse: 'Peggiorato', same: 'Invariato' };

function trendHTML(t, p) {
  if (!t) return '';
  const when = pt => `${U.fmtNum(pt.value, p.decimals)} ${p.unit} del ${U.fmtDate(pt.date)}`;
  if (t.single) return `<div class="trend same"><div>Una sola misura: ${U.esc(when(t.first))}. Servono almeno due misure per vedere il progresso.</div></div>`;
  return `<div class="trend ${t.verdict}">${arrowSVG(t.diff)}<div><span class="verdict">${VERDICT[t.verdict]}</span>: da ${U.esc(when(t.first))} a ${U.esc(when(t.last))}.<br>
    Variazione ${U.fmtSigned(t.diff, p.decimals)} ${U.esc(p.unit)}${t.pct !== null ? ` (${U.fmtSigned(t.pct, 1)}%)` : ''}.
    ${t.weightChanged ? `<br>Attenzione: l'attrezzo è cambiato (${U.fmtKg(t.first.weight)} kg, poi ${U.fmtKg(t.last.weight)} kg), quindi il confronto va letto con cautela.` : ''}</div></div>`;
}

/** Mini grafico in scala propria: serve a vedere la forma dell'andamento di uno studente, non a confrontare studenti. */
function sparkHTML(pts, p) {
  if (!pts.length) return '';
  const W = 96, H = 28;
  const vals = pts.map(x => x.value), lo = Math.min(...vals), hi = Math.max(...vals);
  const d0 = dayNum(pts[0].date), d1 = dayNum(pts[pts.length - 1].date);
  const xs = pt => pts.length === 1 || d1 === d0 ? W / 2 : 6 + ((dayNum(pt.date) - d0) / (d1 - d0)) * (W - 12);
  const ys = v => hi === lo ? H / 2 : H - 5 - ((v - lo) / (hi - lo)) * (H - 10);
  const label = `Andamento: ${pts.map(x => U.fmtNum(x.value, p.decimals)).join(', ')} ${p.unit}`;
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(label)}">
    ${pts.length > 1 ? `<polyline class="l" points="${pts.map(x => `${n1(xs(x))},${n1(ys(x.value))}`).join(' ')}"/>` : ''}
    <circle class="d" cx="${n1(xs(last))}" cy="${n1(ys(last.value))}" r="3"/></svg>`;
}

/** Scheda Progressi della classe: ogni studente è confrontato solo con se stesso. Nessuna media, nessuna classifica. */
function viewProgressi(c) {
  const studs = Q.studentsOfClass(c.id);
  const yid = c.schoolYearId;
  const withData = Q.params(true).filter(p => studs.some(s => Prog.points(s.id, p.id, yid).length));
  if (!studs.length) return '<div class="panel empty"><strong>Nessuno studente</strong>Aggiungi gli studenti alla classe per vedere i progressi.</div>';
  if (!withData.length) return '<div class="panel empty"><strong>Ancora nessuna misura</strong>I progressi compaiono dopo la prima sessione di test con risultati registrati.</div>';
  let p = Q.param(ProgSel[c.id]);
  if (!p || !withData.includes(p)) p = withData[0];
  const counts = Q.homonymCounts();
  const rows = studs.map(s => {
    const pts = Prog.points(s.id, p.id, yid);
    const t = Prog.trend(pts, p);
    const pending = S.results.filter(r => r.studentId === s.id && r.status === 'assente' && Q.session(r.sessionId)?.parameterId === p.id && Q.cls(Q.session(r.sessionId).classId)?.schoolYearId === yid).length;
    const val = pt => `${U.fmtNum(pt.value, p.decimals)} ${U.esc(p.unit)}<span class="small muted">${U.fmtDate(pt.date)}</span>`;
    let first = '<span class="muted">—</span>', last = first, change = '<span class="muted">Nessuna misura</span>';
    if (t) {
      first = val(t.first);
      if (t.single) { last = '<span class="muted">—</span>'; change = '<span class="muted">Una sola misura</span>'; }
      else {
        last = val(t.last);
        change = `<span class="v ${t.verdict}">${arrowSVG(t.diff)}<span>${U.fmtSigned(t.diff, p.decimals)} ${U.esc(p.unit)}${t.pct !== null ? ` (${U.fmtSigned(t.pct, 1)}%)` : ''}<span class="small">${VERDICT[t.verdict]}${t.weightChanged ? ', attrezzo diverso' : ''}</span></span></span>`;
      }
    }
    return `<tr><td><a href="#/studente/${s.id}">${U.esc(Q.displayName(s, counts))}</a></td><td class="num">${pts.length}</td><td>${first}</td><td>${last}</td><td>${change}</td>
      <td>${sparkHTML(pts, p)}</td><td>${pending ? `<span class="tag mark">${pending} da recuperare</span>` : ''}</td></tr>`;
  });
  return `<div class="row" style="margin-bottom:12px; align-items:flex-end">
      <label class="field">Test<select data-change="progParam" data-class="${c.id}">${withData.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${U.esc(x.name)}</option>`).join('')}</select></label>
      <span class="muted small">Anno scolastico ${U.esc(Q.year(yid)?.label ?? '')}, migliore se ${p.betterWhen === 'lower' ? 'più basso' : 'più alto'}</span></div>
    <div class="scroll-x"><table class="prog">
      <thead><tr><th>Studente</th><th class="num">Misure</th><th>Prima misura</th><th>Ultima misura</th><th>Variazione</th><th>Andamento</th><th>Recuperi</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>
    <p class="small muted">Gli studenti sono in ordine alfabetico e ognuno è confrontato solo con le proprie misure. Ogni mini grafico ha una scala propria: serve a vedere la forma dell'andamento, non a confrontare gli studenti.${p.requiresEquipmentWeight ? ' Se l\'attrezzo è cambiato tra la prima e l\'ultima misura, la variazione è segnalata.' : ''}</p>`;
}

/* ==========================================================
   M7: passaggio classi
   La procedura lavora su una bozza in memoria (Wiz): l'archivio S viene
   modificato solo alla conferma finale, con un unico commit().
   ========================================================== */
let Wiz = null;
let lastWizYearId = null;
const WIZ_STEPS = ['Anno di destinazione', 'Classe di origine', 'Nome della nuova classe', 'Studenti che proseguono', 'Nuovi studenti', 'Riepilogo'];

function newWiz() {
  return { step: 1, target: null, sourceId: null, carrySource: null, name: '', nameTouched: false, carry: new Set(), adds: [], error: '', done: null };
}
const wizYearId = () => Wiz.target ? Wiz.target.yearId : null;
const wizTargetLabel = () => Wiz.target ? (Wiz.target.yearId ? (Q.year(Wiz.target.yearId)?.label ?? '') : Wiz.target.label) : '';
/** Vincolo dell'anno di destinazione: una sola iscrizione attiva per anno. */
function wizYearStatus(studentId) {
  const yid = wizYearId();
  if (!yid) return { ok: true };
  const e = S.enrollments.find(x => x.studentId === studentId && !x.removedAt && Q.cls(x.classId)?.schoolYearId === yid);
  return e ? { ok: false, reason: `è già iscritto/a alla classe ${Q.cls(e.classId).name} nel ${Q.year(yid).label}` } : { ok: true };
}
/** Verifica usata dalle finestre di aggiunta: tiene conto anche di chi è già nella bozza. */
function wizStatus(studentId) {
  if (Wiz.carry.has(studentId)) return { ok: false, reason: 'prosegue già dalla classe di origine' };
  if (Wiz.adds.some(a => a.kind === 'link' && a.studentId === studentId)) return { ok: false, reason: 'è già stato aggiunto' };
  return wizYearStatus(studentId);
}
const wizDraftNames = () => Wiz.adds.filter(a => a.kind === 'new')
  .map(a => ({ key: U.normName(a.data.lastName + ' ' + a.data.firstName), birth: a.data.birthDate || '', alias: a.data.alias || '' }));
function suggestNextName(name) {
  const m = /^(\d+)(.*)$/.exec(String(name).trim());
  return m ? `${Number(m[1]) + 1}${m[2]}` : name;
}
/** Problemi che impediscono la conferma, ricontrollati sull'archivio attuale. */
function wizProblems() {
  const out = [];
  const yid = wizYearId();
  if (!yid) { const e = Ops.yearError(Wiz.target.label); if (e) out.push(e); }
  const en = Ops.classNameError(Wiz.name, yid);
  if (en) out.push(en);
  if (!Q.cls(Wiz.sourceId)) out.push('La classe di origine non esiste più.');
  const blocked = [...Wiz.carry, ...Wiz.adds.filter(a => a.kind === 'link').map(a => a.studentId)]
    .map(id => ({ s: Q.student(id), st: wizYearStatus(id) })).filter(x => !x.s || !x.st.ok);
  blocked.forEach(x => out.push(x.s ? `${x.s.lastName} ${x.s.firstName} ${x.st.reason}.` : 'Uno studente selezionato non è più in archivio.'));
  if (!Wiz.carry.size && !Wiz.adds.length) out.push('La nuova classe non avrebbe studenti: selezionane almeno uno o aggiungine di nuovi.');
  return out;
}
/** Applica la bozza all'archivio. Gli studenti non vengono duplicati: si creano solo nuove iscrizioni. */
function applyWizard() {
  const yid = wizYearId() || Ops.addYear(Wiz.target.label).id;
  const c = Ops.addClass(yid, Wiz.name);
  c.sourceClassId = Wiz.sourceId;
  let carried = 0, linked = 0, created = 0;
  [...Wiz.carry].forEach(id => { if (Q.student(id) && Ops.enroll(id, c.id).ok) carried++; });
  Wiz.adds.forEach(a => {
    if (a.kind === 'link') { if (Q.student(a.studentId) && Ops.enroll(a.studentId, c.id).ok) linked++; }
    else { const s = Ops.createStudent(a.data); Ops.enroll(s.id, c.id); created++; }
  });
  S.settings.selectedYearId = yid;
  return { classId: c.id, yearId: yid, sourceId: Wiz.sourceId, carried, linked, created };
}

/* ---------- Passi ---------- */
function wizStep1() {
  const years = Q.years();
  const t = Wiz.target;
  const sel = t ? (t.yearId || 'new') : (lastWizYearId && Q.year(lastWizYearId) ? lastWizYearId : 'new');
  const newLabel = t && !t.yearId ? t.label : Ops.suggestYear();
  return `<h3>Anno di destinazione</h3>
    <p class="small muted">L'anno in cui creare la nuova classe. Se non esiste ancora, crealo qui: verrà salvato solo alla conferma finale.</p>
    <div class="choices">${years.map(y => {
      const n = Q.classesOfYear(y.id).length;
      return `<label class="choice"><input type="radio" name="wizYear" value="${y.id}" ${sel === y.id ? 'checked' : ''}><span><strong>${U.esc(y.label)}</strong><span class="small muted">${n} ${n === 1 ? 'classe' : 'classi'}</span></span></label>`;
    }).join('')}
      <label class="choice"><input type="radio" name="wizYear" value="new" ${sel === 'new' ? 'checked' : ''}><span><strong>Nuovo anno scolastico</strong>
        <input type="text" id="wizNewYear" value="${U.esc(newLabel)}" autocomplete="off" inputmode="numeric" aria-label="Nuovo anno scolastico" style="margin-top:6px; max-width:180px"></span></label>
    </div>`;
}
function wizStep2() {
  const yid = wizYearId(), tLabel = wizTargetLabel();
  const cands = S.classes.filter(c => c.schoolYearId !== yid);
  const yearIds = [...new Set(cands.map(c => c.schoolYearId))].sort((a, b) => (Q.year(b)?.label ?? '').localeCompare(Q.year(a)?.label ?? ''));
  let sel = Wiz.sourceId;
  if (!cands.some(c => c.id === sel)) {
    const prevYear = yearIds.find(y => (Q.year(y)?.label ?? '') < tLabel) || yearIds[0];
    sel = Q.classesOfYear(prevYear)[0]?.id;
  }
  return `<h3>Classe di origine</h3>
    <p class="small muted">La classe da cui proseguono gli studenti. Non verrà modificata: resterà nel suo anno con tutto lo storico.</p>
    ${yearIds.map(y => `<h4 class="grp">${U.esc(Q.year(y)?.label ?? '')}</h4><div class="choices">${Q.classesOfYear(y).map(c => {
      const n = Q.activeEnrollments(c.id).length;
      const passed = S.classes.filter(x => x.sourceClassId === c.id);
      return `<label class="choice"><input type="radio" name="wizSource" value="${c.id}" ${c.id === sel ? 'checked' : ''}><span><strong>${U.esc(c.name)}</strong>
        <span class="small muted">${n} ${n === 1 ? 'studente' : 'studenti'}${passed.length ? `, già passata come ${passed.map(x => `${U.esc(x.name)} (${U.esc(Q.year(x.schoolYearId)?.label ?? '')})`).join(', ')}` : ''}</span></span></label>`;
    }).join('')}</div>`).join('')}`;
}
function wizStep3() {
  const src = Q.cls(Wiz.sourceId);
  return `<h3>Nome della nuova classe</h3>
    <p class="small muted">Classe di origine ${U.esc(src?.name ?? '')}, anno di destinazione ${U.esc(wizTargetLabel())}.</p>
    <label class="field" style="max-width:240px">Nome<input type="text" id="wizName" value="${U.esc(Wiz.name)}" maxlength="20" autocomplete="off"></label>`;
}
function wizStep4() {
  const studs = Q.studentsOfClass(Wiz.sourceId);
  studs.forEach(s => { if (!wizYearStatus(s.id).ok) Wiz.carry.delete(s.id); });
  if (!studs.length) return `<h3>Studenti che proseguono</h3><div class="notice">La classe di origine non ha studenti iscritti. Potrai aggiungere gli studenti al passo successivo.</div>`;
  const counts = Q.homonymCounts();
  const eligible = studs.filter(s => wizYearStatus(s.id).ok).length;
  return `<h3>Studenti che proseguono</h3>
    <p class="small muted">Togli la spunta a chi non prosegue nella nuova classe (per esempio chi cambia sezione o scuola). Lo storico di chi prosegue resta collegato.</p>
    <div class="row" style="margin-bottom:10px"><span class="small muted" id="wizCount">${Wiz.carry.size} di ${eligible} proseguono</span><span class="spacer"></span>
      <button type="button" class="btn ghost" data-action="wizAll" data-v="1">Seleziona tutti</button>
      <button type="button" class="btn ghost" data-action="wizAll" data-v="0">Nessuno</button></div>
    <ul class="list">${studs.map(s => {
      const st = wizYearStatus(s.id);
      return `<li><label class="item"><input type="checkbox" data-wcarry="${s.id}" ${Wiz.carry.has(s.id) ? 'checked' : ''} ${st.ok ? '' : 'disabled'}>
        <span>${U.esc(Q.displayName(s, counts))}${st.ok ? '' : `<br><span class="small muted">Non può proseguire qui: ${U.esc(st.reason)}.</span>`}</span></label></li>`;
    }).join('')}</ul>`;
}
function wizStep5() {
  const counts = Q.homonymCounts();
  return `<h3>Nuovi studenti</h3>
    <p class="small muted">Facoltativo: aggiungi chi arriva nella classe ${U.esc(Wiz.name)}, per esempio da un'altra sezione o da un'altra scuola. Se uno studente è già in archivio, l'app chiede se è la stessa persona.</p>
    <div class="row" style="margin-bottom:10px"><button type="button" class="btn" data-action="wizAddList">Aggiungi da elenco</button>
      <button type="button" class="btn primary" data-action="wizAddOne">Aggiungi studente</button></div>
    ${Wiz.adds.length ? `<ul class="list">${Wiz.adds.map((a, i) => {
      const label = a.kind === 'link' ? (() => { const s = Q.student(a.studentId); return s ? `${Q.displayName(s, counts)}` : '?'; })()
        : `${a.data.lastName} ${a.data.firstName}${a.data.alias ? ` (${a.data.alias})` : a.data.birthDate ? ` (${U.fmtDate(a.data.birthDate)})` : ''}`;
      const note = a.kind === 'link' ? `già in archivio, ${Ops.describe(Q.student(a.studentId) || {})}` : 'nuovo studente';
      return `<li><div class="item"><span><strong>${U.esc(label)}</strong><br><span class="small muted">${U.esc(note)}</span></span><span class="spacer"></span>
        <button type="button" class="btn ghost" data-action="wizRemoveAdd" data-i="${i}">Togli</button></div></li>`;
    }).join('')}</ul>` : '<p class="muted">Nessun nuovo studente aggiunto.</p>'}`;
}
function wizStep6() {
  const src = Q.cls(Wiz.sourceId);
  const counts = Q.homonymCounts();
  const carry = [...Wiz.carry].map(id => Q.student(id)).filter(Boolean).sort(U.byName);
  const links = Wiz.adds.filter(a => a.kind === 'link').map(a => Q.student(a.studentId)).filter(Boolean);
  const news = Wiz.adds.filter(a => a.kind === 'new');
  const total = carry.length + links.length + news.length;
  const problems = wizProblems();
  const names = [...carry.map(s => Q.displayName(s, counts)), ...links.map(s => Q.displayName(s, counts)), ...news.map(a => `${a.data.lastName} ${a.data.firstName}`)]
    .sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
  return `<h3>Riepilogo</h3>
    <dl class="sumlist">
      <dt>Anno di destinazione</dt><dd>${U.esc(wizTargetLabel())}${wizYearId() ? '' : ' (verrà creato)'}</dd>
      <dt>Classe di origine</dt><dd>${U.esc(src?.name ?? '')} (${U.esc(Q.year(src?.schoolYearId)?.label ?? '')}), non verrà modificata</dd>
      <dt>Nuova classe</dt><dd><strong>${U.esc(Wiz.name)}</strong></dd>
      <dt>Studenti</dt><dd>${total} in tutto: ${carry.length} proseguono, ${links.length} già in archivio aggiunti, ${news.length} nuovi</dd>
    </dl>
    ${problems.length ? `<div class="notice danger"><strong>Da sistemare prima di confermare</strong><br>${problems.map(p => U.esc(p)).join('<br>')}</div>` : ''}
    <details class="dt"><summary>Elenco degli studenti (${total})</summary><p class="small">${names.map(n => U.esc(n)).join(', ') || 'Nessuno'}</p></details>
    <p class="small muted">Alla conferma verranno creati la classe e le iscrizioni in un'unica operazione. Gli studenti che proseguono non vengono duplicati: è lo stesso studente con il suo storico.</p>`;
}
function wizDoneHTML() {
  const d = Wiz.done, c = Q.cls(d.classId), src = Q.cls(d.sourceId), y = Q.year(d.yearId);
  const total = d.carried + d.linked + d.created;
  const srcYear = src?.schoolYearId;
  const remaining = srcYear ? Q.classesOfYear(srcYear).filter(x => !S.classes.some(k => k.sourceClassId === x.id && k.schoolYearId === d.yearId)) : [];

function backupStatus() {
  if (archiveIsEmpty()) return null;
  const last = S.settings.lastBackupAt;
  const t = last ? Date.parse(last) : NaN;
  const days = Number.isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 86400000));
  const limit = S.settings.backupReminderDays || 14;
  return { last, days, limit, due: days === null || days >= limit };
}
function backupReminderHTML() {
  const b = backupStatus();

}

/** Avvia lo scaricamento di un file generato in memoria: nessun dato esce dal dispositivo. */
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function exportBackup() {
  const now = new Date().toISOString();
  S.settings.lastBackupAt = now;
  const data = { ...S, app: APP_ID, schemaVersion: SCHEMA_VERSION, exportedAt: now };
  downloadFile(`registro-scienze-motorie-backup_${stamp()}.json`, JSON.stringify(data, null, 1), 'application/json');
  await commit('Backup esportato: conservalo fuori dal dispositivo');
}

/* ---------- Validazione del backup ---------- */
/** Aggiornamenti del formato: MIGRATIONS[n] porta un archivio dalla versione n alla n+1. */
const MIGRATIONS = {};
function migrateSchema(d) {
  while (d.schemaVersion < SCHEMA_VERSION) {
    const fn = MIGRATIONS[d.schemaVersion];
    if (!fn) throw new Error(`formato ${d.schemaVersion} non supportato`);
    d = fn(d); d.schemaVersion += 1;
  }
  return d;
}
const isISODate = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !Number.isNaN(Date.parse(x));
const isStr = (x, max, allowEmpty = false) => typeof x === 'string' && x.length <= max && (allowEmpty || x.trim().length > 0);
const isNum = x => typeof x === 'number' && Number.isFinite(x);

/**
 * Controlla un backup e ne ricostruisce una copia pulita (solo i campi noti).
 * Restituisce { errors: [...] } oppure { errors: [], data }.
 */
function validateBackup(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { errors: ['Il file non contiene un archivio valido.'] };
  if (raw.app !== APP_ID) return { errors: ['Il file non è un backup del Registro Scienze Motorie.'] };
  const v = raw.schemaVersion;
  if (!Number.isInteger(v) || v < 1) return { errors: ['La versione del formato del backup non è riconosciuta.'] };
  if (v > SCHEMA_VERSION) return { errors: [`Il backup è stato creato da una versione più recente dell'app (formato ${v}, questa app usa il formato ${SCHEMA_VERSION}). Usa il file dell'app più recente e riprova.`] };
  let d;
  try { d = migrateSchema(JSON.parse(JSON.stringify(raw))); }
  catch (e) { return { errors: ['Impossibile aggiornare il formato del backup: ' + e.message + '.'] }; }
  for (const k of ['schoolYears', 'students', 'classes', 'enrollments', 'parameters', 'sessions', 'results']) {
    if (!Array.isArray(d[k])) return { errors: [`Nel backup manca l'elenco "${k}".`] };
  }
  const errors = [];
  const err = m => { if (errors.length < 200) errors.push(m); };
  const ids = new Set();
  const idOk = (x, what) => {
    if (!isStr(x && x.id, 100)) { err(`${what}: identificativo mancante.`); return false; }
    if (ids.has(x.id)) { err(`${what}: identificativo duplicato (${x.id}).`); return false; }
    ids.add(x.id); return true;
  };
  const out = { schoolYears: [], students: [], classes: [], enrollments: [], parameters: [], sessions: [], results: [] };

  const labels = new Set();
  d.schoolYears.forEach((y, i) => {
    const w = `Anno ${i + 1}`;
    if (!idOk(y, w)) return;
    if (!isStr(y.label, 7) || !/^\d{4}\/\d{2}$/.test(y.label)) return err(`${w}: nome dell'anno non valido.`);
    if (labels.has(y.label)) return err(`Anno ${y.label} presente due volte.`);
    labels.add(y.label);
    out.schoolYears.push({ id: y.id, label: y.label });
  });
  const yearIds = new Set(out.schoolYears.map(y => y.id));

  d.students.forEach((s, i) => {
    const w = `Studente ${i + 1}`;
    if (!idOk(s, w)) return;
    if (!isStr(s.lastName, 60) || !isStr(s.firstName, 60)) return err(`${w}: nome o cognome non validi.`);
    if (s.birthDate != null && !isISODate(s.birthDate)) return err(`${w} (${s.lastName} ${s.firstName}): data di nascita non valida.`);
    if (s.alias != null && !isStr(s.alias, 40, true)) return err(`${w} (${s.lastName} ${s.firstName}): alias non valido.`);
    out.students.push({ id: s.id, firstName: s.firstName, lastName: s.lastName, birthDate: s.birthDate || null, alias: s.alias || '' });
  });
  const studentIds = new Set(out.students.map(s => s.id));

  d.classes.forEach((c, i) => {
    const w = `Classe ${i + 1}`;
    if (!idOk(c, w)) return;
    if (!isStr(c.name, 20)) return err(`${w}: nome non valido.`);
    if (!yearIds.has(c.schoolYearId)) return err(`Classe ${c.name}: anno scolastico inesistente.`);
    out.classes.push({ id: c.id, schoolYearId: c.schoolYearId, name: c.name, sourceClassId: c.sourceClassId || null });
  });
  const classById = new Map(out.classes.map(c => [c.id, c]));
  out.classes.forEach(c => { if (c.sourceClassId && !classById.has(c.sourceClassId)) c.sourceClassId = null; });   // collegamento informativo: se manca si toglie

  const activePerYear = new Set();
  d.enrollments.forEach((e, i) => {
    const w = `Iscrizione ${i + 1}`;
    if (!idOk(e, w)) return;
    if (!classById.has(e.classId) || !studentIds.has(e.studentId)) return err(`${w}: classe o studente inesistente.`);
    if (e.addedAt != null && !isISODate(e.addedAt)) return err(`${w}: data di iscrizione non valida.`);
    if (e.removedAt != null && !isISODate(e.removedAt)) return err(`${w}: data di uscita non valida.`);
    if (!e.removedAt) {
      const k = e.studentId + '|' + classById.get(e.classId).schoolYearId;
      if (activePerYear.has(k)) return err(`${w}: lo stesso studente è iscritto a due classi nello stesso anno.`);
      activePerYear.add(k);
    }
    out.enrollments.push({ id: e.id, classId: e.classId, studentId: e.studentId, addedAt: e.addedAt || null, removedAt: e.removedAt || null });
  });

  const pnames = new Set();
  d.parameters.forEach((p, i) => {
    const w = `Parametro ${i + 1}`;
    if (!idOk(p, w)) return;
    if (!isStr(p.name, 40) || !isStr(p.unit, 12)) return err(`${w}: nome o unità non validi.`);
    if (!['tempo', 'distanza', 'conteggio'].includes(p.type) || !['lower', 'higher'].includes(p.betterWhen)) return err(`Parametro ${p.name}: tipo o direzione non validi.`);
    if (!Number.isInteger(p.decimals) || p.decimals < 0 || p.decimals > 3 || !Number.isInteger(p.attempts) || p.attempts < 1 || p.attempts > 10) return err(`Parametro ${p.name}: decimali o numero di prove non validi.`);
    const k = U.normName(p.name);
    if (pnames.has(k)) return err(`Parametro ${p.name} presente due volte.`);
    pnames.add(k);
    out.parameters.push({ id: p.id, name: p.name, unit: p.unit, type: p.type, betterWhen: p.betterWhen, decimals: p.decimals, attempts: p.attempts,
      requiresEquipmentWeight: p.requiresEquipmentWeight === true, active: p.active !== false, order: isNum(p.order) ? p.order : i + 1 });
  });
  const paramById = new Map(out.parameters.map(p => [p.id, p]));

  const sesKeys = new Set();
  d.sessions.forEach((s, i) => {
    const w = `Sessione ${i + 1}`;
    if (!idOk(s, w)) return;
    if (!classById.has(s.classId) || !paramById.has(s.parameterId)) return err(`${w}: classe o test inesistente.`);
    if (!isISODate(s.date)) return err(`${w}: data non valida.`);
    if (s.equipmentWeightKg != null && !(isNum(s.equipmentWeightKg) && s.equipmentWeightKg > 0)) return err(`${w}: peso dell'attrezzo non valido.`);
    const k = s.classId + '|' + s.parameterId + '|' + s.date;
    if (sesKeys.has(k)) return err(`${w}: sessione doppia (stessa classe, test e data).`);
    sesKeys.add(k);
    out.sessions.push({ id: s.id, classId: s.classId, parameterId: s.parameterId, date: s.date, equipmentWeightKg: s.equipmentWeightKg ?? null });
  });
  const sesById = new Map(out.sessions.map(s => [s.id, s]));

  const resKeys = new Set();
  d.results.forEach((r, i) => {
    const w = `Risultato ${i + 1}`;
    if (!idOk(r, w)) return;
    const ses = sesById.get(r.sessionId);
    if (!ses || !studentIds.has(r.studentId)) return err(`${w}: sessione o studente inesistente.`);
    const p = paramById.get(ses.parameterId);
    const k = r.sessionId + '|' + r.studentId;
    if (resKeys.has(k)) return err(`${w}: due risultati per lo stesso studente nella stessa sessione.`);
    resKeys.add(k);
    if (!['misurato', 'assente', 'esonerato'].includes(r.status)) return err(`${w}: stato non valido.`);
    if (r.status !== 'misurato') {
      out.results.push({ id: r.id, sessionId: r.sessionId, studentId: r.studentId, status: r.status, trials: Array(p.attempts).fill(null), value: null, measuredOn: null });
      return;
    }
    if (!Array.isArray(r.trials) || r.trials.length !== p.attempts || !r.trials.every(t => t === null || (isNum(t) && t >= 0))) return err(`${w}: prove non valide per ${p.name}.`);
    if (!r.trials.some(t => t !== null)) return err(`${w}: risultato misurato senza prove.`);
    if (!isISODate(r.measuredOn)) return err(`${w}: data di misura non valida.`);
    // Il migliore si ricalcola sempre dalle prove: è un dato derivato
    out.results.push({ id: r.id, sessionId: r.sessionId, studentId: r.studentId, status: 'misurato', trials: r.trials.slice(), value: U.bestOf(r.trials, p.betterWhen), measuredOn: r.measuredOn });
  });

  const st = d.settings && typeof d.settings === 'object' ? d.settings : {};
  const exportedAt = typeof d.exportedAt === 'string' && !Number.isNaN(Date.parse(d.exportedAt)) ? d.exportedAt : null;
  const lastFromFile = typeof st.lastBackupAt === 'string' && !Number.isNaN(Date.parse(st.lastBackupAt)) ? st.lastBackupAt : null;
  const data = {
    app: APP_ID, schemaVersion: SCHEMA_VERSION, exportedAt,
    settings: {
      backupReminderDays: [3, 7, 14, 30].includes(st.backupReminderDays) ? st.backupReminderDays : 14,
      lastBackupAt: exportedAt || lastFromFile,
      selectedYearId: yearIds.has(st.selectedYearId) ? st.selectedYearId : null
    },
    ...out
  };
  return { errors, data };
}

    <div class="modal-actions">${BTN_CANCEL}<button type="button" class="btn ${needWord ? 'danger' : 'primary'}" data-do="ok" ${needWord ? 'disabled' : ''}>${needWord ? 'Sostituisci archivio' : 'Ripristina backup'}</button></div></div>`);

/** Legge il testo di un file di backup, lo controlla e, se confermato, sostituisce l'archivio. */
async function handleImportText(text, fileName) {
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { await infoDialog('Backup non leggibile', '<p>Il file non è in formato JSON valido. Controlla di aver scelto il file di backup esportato dall\'app.</p>'); return false; }
  const { errors, data } = validateBackup(raw);
  if (errors.length) {
    const shown = errors.slice(0, 6);
    await infoDialog('Backup non valido', `<p>Il file non è stato importato e l'archivio attuale non è cambiato.</p>
      <ul class="err-list">${shown.map(e => `<li>${U.esc(e)}</li>`).join('')}</ul>
      ${errors.length > shown.length ? `<p class="small muted">E altri ${errors.length - shown.length} problemi.</p>` : ''}`);
    return false;
  }
  if (!(await dlgImportSummary(data, fileName))) return false;
  S = data;
  migrateNames();
  resetUiState();
  await commit('Backup ripristinato');
  go('#/classi');
  return true;
}

/* ---------- CSV per Excel ---------- */
function csvText(v) {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;           // evita che Excel interpreti il testo come formula
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvNum = (v, dec) => (v === null || v === undefined) ? '' : Number(v).toFixed(dec).replace('.', ',');
const csvDate = iso => iso ? U.fmtDate(iso) : '';
const csvKg = w => (w === null || w === undefined) ? '' : String(w).replace('.', ',');

function buildCSV(yearId = 'all') {
  const rows = S.results.map(r => {
    const ses = Q.session(r.sessionId), st = Q.student(r.studentId);
    const p = ses && Q.param(ses.parameterId), c = ses && Q.cls(ses.classId), y = c && Q.year(c.schoolYearId);
    return { r, ses, st, p, c, y };
  }).filter(x => x.ses && x.st && x.p && x.c && x.y && (yearId === 'all' || x.c.schoolYearId === yearId));
  rows.sort((a, b) => a.y.label.localeCompare(b.y.label) || a.c.name.localeCompare(b.c.name, 'it', { numeric: true })
    || U.byName(a.st, b.st) || a.p.order - b.p.order || a.ses.date.localeCompare(b.ses.date));
  const maxTrials = Math.max(1, ...rows.map(x => x.p.attempts));
  const head = ['Anno scolastico', 'Classe', 'Cognome', 'Nome', 'Alias', 'Test', 'Unità', 'Migliore se', 'Data sessione', 'Data misura', 'Stato',
    ...Array.from({ length: maxTrials }, (_, i) => `Prova ${i + 1}`), 'Migliore', 'Peso attrezzo (kg)'];
  const status = x => x.r.status === 'misurato' ? (x.r.measuredOn !== x.ses.date ? 'Recuperato' : 'Misurato') : x.r.status === 'assente' ? 'Assente' : 'Esonerato';
  const lines = rows.map(x => [
    csvText(x.y.label), csvText(x.c.name), csvText(x.st.lastName), csvText(x.st.firstName), csvText(x.st.alias || ''),
    csvText(x.p.name), csvText(x.p.unit), x.p.betterWhen === 'lower' ? 'più basso' : 'più alto',
    csvDate(x.ses.date), csvDate(x.r.measuredOn), status(x),
    ...Array.from({ length: maxTrials }, (_, i) => csvNum(x.r.trials[i] ?? null, x.p.decimals)),
    csvNum(x.r.value, x.p.decimals), csvKg(x.ses.equipmentWeightKg)
  ].join(';'));
  return { count: rows.length, text: '\uFEFF' + [head.map(csvText).join(';'), ...lines].join('\r\n') + '\r\n' };
}

/* ==========================================================
   M9: installazione e uso offline
   Il service worker (sw.js) si registra solo se la pagina è servita via HTTPS o da localhost.
   Aprendo il file in locale non si registra nulla e non partono richieste aggiuntive.
   ========================================================== */
const PWA = { reg: null, waiting: null, applying: false, install: null, error: null, dismissed: false, reload: () => location.reload() };
const pwaSupported = () => !!window.isSecureContext && 'serviceWorker' in navigator && location.protocol !== 'file:';
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const refreshDatiIfOpen = () => { if (/^#\/dati/.test(location.hash)) render(); };
function showUpdate() {
  PWA.dismissed = false;
  const b = document.getElementById('updateBar');
  if (b) b.hidden = false;
}
function addHeadLink(rel, href) {
  const l = document.createElement('link');
  l.rel = rel; l.href = href;
  document.head.appendChild(l);
}

async function initPWA() {
  if (!pwaSupported()) return;
  addHeadLink('manifest', 'manifest.json');
  addHeadLink('apple-touch-icon', 'apple-touch-icon.png');
  const sw = navigator.serviceWorker;
  sw.addEventListener('message', e => {
    const t = e.data && e.data.type;
    if (t === 'APP_UPDATED') showUpdate();
    else if (t === 'UP_TO_DATE') toast('Hai già la versione più recente');
    else if (t === 'OFFLINE') toast('Controllo non riuscito: sei connesso a internet?', 'error');
  });
  sw.addEventListener('controllerchange', () => {
    // La prima installazione assume il controllo senza ricaricare; si ricarica solo se l'utente ha scelto di aggiornare.
    if (PWA.applying) PWA.reload(); else refreshDatiIfOpen();
  });
  try {
    PWA.reg = await sw.register('sw.js');
  } catch (e) {
    PWA.error = e;
    refreshDatiIfOpen();
    return;
  }
  const reg = PWA.reg;
  if (reg.waiting && sw.controller) { PWA.waiting = reg.waiting; showUpdate(); }
  reg.addEventListener('updatefound', () => {
    const nw = reg.installing;
    if (!nw) return;
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed' && sw.controller) { PWA.waiting = nw; showUpdate(); }
    });
  });
  try { await sw.ready; } catch (e) { /* nessuna azione */ }
  refreshDatiIfOpen();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.install = e; refreshDatiIfOpen(); });
window.addEventListener('appinstalled', () => { PWA.install = null; toast('App installata'); refreshDatiIfOpen(); });

function pwaPanelHTML() {
  let msg, btns = '';
  const sw = pwaSupported() ? navigator.serviceWorker : null;
  if (location.protocol === 'file:') {
    msg = 'Stai usando il file salvato sul dispositivo: funziona senza connessione. Per installare l\'app sulla schermata Home serve la versione pubblicata su un indirizzo https.';
  } else if (!sw) {
    msg = 'Questo browser non permette l\'uso offline dell\'app installata. L\'app funziona comunque finché la pagina resta aperta.';
  } else if (PWA.error) {
    msg = 'L\'uso offline non è stato attivato su questo dispositivo. Ricarica la pagina; se il problema continua, controlla che il browser non blocchi i service worker.';
  } else if (sw.controller) {
    msg = 'Pronta per l\'uso offline: l\'app è salvata su questo dispositivo e si apre anche senza connessione.' + (isStandalone() ? ' È installata come app.' : '');
    if (PWA.install && !isStandalone()) btns += '<button type="button" class="btn primary" data-action="installApp">Installa l\'app</button>';
    btns += '<button type="button" class="btn" data-action="checkUpdate">Controlla aggiornamenti</button>';
  } else {
    msg = 'Preparazione dell\'uso offline in corso. Riapri l\'app tra qualche istante.';
  }
  return `<h3>Uso offline e installazione</h3>
    <div class="panel">
      <p style="margin-top:0">${U.esc(msg)}</p>
      ${btns ? `<div class="row">${btns}</div>` : ''}
      <p class="small muted" style="margin-bottom:0">I dati sono conservati separatamente per ogni indirizzo da cui si apre l'app: il file locale e la versione pubblicata hanno archivi diversi. Per passare dall'uno all'altro, esporta il backup e importalo.</p>
    </div>`;
}

/* ---------- Navigazione ---------- */
const routes = [
  { re: /^#\/classi$/, sec: 'classi', fn: () => viewClassi() },
  { re: /^#\/classe\/([\w-]+)(?:\/(studenti|sessioni|progressi|recuperi))?$/, sec: 'classi', fn: m => viewClasse(m[1], m[2] || 'studenti') },
  { re: /^#\/studente\/([\w-]+)$/, sec: 'classi', fn: m => viewStudente(m[1]) },
  { re: /^#\/sessione\/([\w-]+)(?:\/(riepilogo)|\/s\/([\w-]+))?$/, sec: 'classi', fn: m => viewSessione(m[1], m[2] || 'entry', m[3]) },
  { re: /^#\/passaggio$/, sec: 'classi', fn: () => viewPassaggio() },
  { re: /^#\/recuperi$/, sec: 'recuperi', fn: () => viewRecuperi() },
  { re: /^#\/parametri$/, sec: 'parametri', fn: () => viewParametri() },
  { re: /^#\/dati$/, sec: 'dati', fn: () => viewDati() }
];
function render() {
  SesCtx = null;
  const hash = location.hash || '#/classi';
  let html = null, sec = 'classi';
  for (const r of routes) {
    const m = hash.match(r.re);
    if (m) { html = r.fn(m); sec = r.sec; break; }
  }
  if (html === null) { location.replace('#/classi'); return; }
  const main = document.getElementById('main');
  const bannerMemory = Storage.mode === 'memory'
    ? '<div class="notice danger">Questo browser non permette di salvare i dati: tutto andrà perso alla chiusura. Apri il file con Chrome o Edge aggiornati.</div>' : '';
  main.innerHTML = bannerMemory + html;
  const af = main.querySelector('[data-autofocus]');
  if (af) af.focus();
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.dataset.sec === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  updateNavCounts();
}
function updateNavCounts() {
  const n = Q.pendingAll().length;
  const el = document.getElementById('navPending');
  el.hidden = !n; el.textContent = n;
}

Object.assign(Actions, {
  async addParam() {
    const data = await dlgParam(null);
    if (!data) return;
    S.parameters.push({ id: U.uid('p'), ...data, active: true, order: Ops.nextParamOrder() });
    await commit(`Parametro "${data.name}" aggiunto`);
    render();
  },
  async editParam(el) {
    const p = Q.param(el.dataset.param);
    if (!p) return;
    const data = await dlgParam(p);
    if (!data) return;
    // Se il parametro è in uso il dialogo restituisce solo il nome; per sicurezza si ricontrolla qui.
    if (Ops.paramInUse(p.id)) p.name = data.name; else Object.assign(p, data);
    await commit('Parametro aggiornato');
    render();
  },
  async moveParam(el) {
    const all = Q.params(true);
    const i = all.findIndex(p => p.id === el.dataset.param);
    if (i < 0) return;
    const step = el.dataset.dir === 'up' ? -1 : 1;
    let j = i + step;
    while (j >= 0 && j < all.length && !all[j].active) j += step;   // salta gli archiviati
    if (j < 0 || j >= all.length) return;
    [all[i], all[j]] = [all[j], all[i]];
    all.forEach((p, k) => { p.order = k + 1; });
    await commit();
    render();
  },
  async toggleParam(el) {
    const p = Q.param(el.dataset.param);
    if (!p) return;
    p.active = !p.active;
    await commit(p.active ? `"${p.name}" riattivato` : `"${p.name}" archiviato: lo storico resta consultabile`);
    render();
  },
  async deleteParam(el) {
    const p = Q.param(el.dataset.param);
    if (!p || Ops.paramInUse(p.id)) return;
    const ok = await confirmDialog({ title: `Eliminare "${p.name}"?`, message: 'Il parametro non è stato mai usato in nessuna sessione. L\'operazione non si può annullare.', confirmLabel: 'Elimina parametro', danger: true });
    if (!ok) return;
    S.parameters = S.parameters.filter(x => x.id !== p.id);
    await commit(`Parametro "${p.name}" eliminato`);
    render();
  }
});
Object.assign(Actions, {
  async newSession(el) {
    const r = await dlgSession(el.dataset.class);
    if (!r) return;
    if (r.openId) { go('#/sessione/' + r.openId); return; }
    const ses = Ops.createSession(r);
    await commit('Sessione creata');
    go('#/sessione/' + ses.id);
  },
  async sesMove(el) {
    if (!SesCtx) return;
    const { sesId, ids, idx } = SesCtx;
    if (!(await saveCurrent(true))) return;
    const dir = el.dataset.dir;
    if (dir === 'summary' || (dir === '1' && idx === ids.length - 1)) { goReplace(`#/sessione/${sesId}/riepilogo`); return; }
    const j = idx + Number(dir);
    if (j >= 0 && j < ids.length) goReplace(`#/sessione/${sesId}/s/${ids[j]}`);
  },
  async sesJump(el) {
    if (!SesCtx) return;
    const sesId = SesCtx.sesId;
    if (!(await saveCurrent(true))) return;
    goReplace(`#/sessione/${sesId}/s/${el.dataset.student}`);
  },
  async sesStatus(el) {
    if (!SesCtx) return;
    const { sesId, studentId, ids, idx } = SesCtx;
    const ses = Q.session(sesId), status = el.dataset.status;
    const r = Ops.resultOf(sesId, studentId);
    if (r && r.status === status) {   // secondo tocco: annulla assenza o esonero
      Ops.deleteResult(r.id);
      await commit(status === 'assente' ? 'Assenza annullata' : 'Esonero annullato');
      render();
      return;
    }
    const typed = trialInputs().some(i => !i.disabled && i.value.trim() !== '');
    if (typed || (r && r.status === 'misurato')) {
      const st = Q.student(studentId);
      const ok = await confirmDialog({
        title: status === 'assente' ? 'Segnare come assente?' : 'Segnare come esonerato?',
        message: `Le prove inserite per ${st.lastName} ${st.firstName} in questa sessione verranno cancellate.`,
        confirmLabel: status === 'assente' ? 'Segna assente' : 'Segna esonerato'
      });
      if (!ok) return;
    }
    clearTimeout(saveTimer); saveTimer = null;
    Ops.setStatus(ses, studentId, status);
    await commit(status === 'assente' ? 'Segnato assente: da recuperare' : 'Segnato esonerato');
    if (idx === ids.length - 1) goReplace(`#/sessione/${sesId}/riepilogo`);
    else goReplace(`#/sessione/${sesId}/s/${ids[idx + 1]}`);
  },
  async sesMarkRest(el) {
    const ses = Q.session(el.dataset.session);
    if (!ses) return;
    const todo = sessionRoster(ses).filter(s => !Ops.resultOf(ses.id, s.id));
    if (!todo.length) return;
    const ok = await confirmDialog({
      title: 'Segnare come assenti?',
      message: `${todo.length === 1 ? 'Lo studente senza risultato verrà segnato' : `I ${todo.length} studenti senza risultato verranno segnati`} come assenti e compariranno tra i recuperi.`,
      confirmLabel: 'Segna come assenti'
    });
    if (!ok) return;
    todo.forEach(s => Ops.setStatus(ses, s.id, 'assente'));
    await commit('Segnati come assenti');
    render();
  },
  async sesEdit(el) {
    if (SesCtx && !(await saveCurrent(true))) return;
    const ses = Q.session(el.dataset.session);
    if (!ses) return;
    const r = await dlgSessionEdit(ses);
    if (!r) return;
    if (r.date !== ses.date) Ops.changeSessionDate(ses, r.date);
    ses.equipmentWeightKg = r.equipmentWeightKg;
    await commit('Sessione aggiornata');
    render();
  },
  async sesDelete(el) {
    const ses = Q.session(el.dataset.session);
    if (!ses) return;
    const p = Q.param(ses.parameterId), c = Q.cls(ses.classId);
    const n = Q.resultsOfSession(ses.id).length;
    const ok = await confirmDialog({
      title: 'Eliminare la sessione?',
      message: `Sessione di ${p.name} del ${U.fmtDate(ses.date)}, classe ${c.name}. ${n ? `Verranno cancellati anche ${n} risultati, comprese assenze ed esoneri.` : 'Non contiene risultati.'} L'operazione non si può annullare.`,
      confirmLabel: 'Elimina sessione', danger: true, requireText: n ? 'ELIMINA' : null
    });
    if (!ok) return;
    clearTimeout(saveTimer); saveTimer = null;
    Ops.deleteSession(ses.id);
    await commit('Sessione eliminata');
    go(`#/classe/${c.id}/sessioni`);
  }
});

Object.assign(Actions, {
  startWizard(el) {
    Wiz = newWiz();
    const y = Q.year(el.dataset.year);
    if (y) Wiz.target = { yearId: y.id, label: y.label };
    go('#/passaggio');
  },
  async wizNext() {
    if (!Wiz) return;
    const fail = msg => { Wiz.error = msg; render(); };
    const q = s => document.querySelector(s);
    if (Wiz.step === 1) {
      const v = q('input[name="wizYear"]:checked')?.value;
      if (!v) return fail('Scegli l\'anno di destinazione.');
      let target;
      if (v === 'new') {
        const label = q('#wizNewYear').value.trim();
        const e = Ops.yearError(label);
        if (e) return fail(e);
        target = { yearId: null, label };
      } else target = { yearId: v, label: Q.year(v).label };
      if (!S.classes.some(c => c.schoolYearId !== target.yearId)) return fail('Non ci sono classi di altri anni da cui far proseguire gli studenti.');
      Wiz.target = target;
      if (Wiz.sourceId && Q.cls(Wiz.sourceId)?.schoolYearId === target.yearId) Wiz.sourceId = null;
      Wiz.step = 2;
    } else if (Wiz.step === 2) {
      const v = q('input[name="wizSource"]:checked')?.value;
      const src = Q.cls(v);
      if (!src) return fail('Scegli la classe di origine.');
      Wiz.sourceId = src.id;
      if (Wiz.carrySource !== src.id) {
        Wiz.carry = new Set(Q.studentsOfClass(src.id).filter(s => wizYearStatus(s.id).ok).map(s => s.id));
        Wiz.carrySource = src.id;
        if (!Wiz.nameTouched) Wiz.name = suggestNextName(src.name);
      }
      Wiz.step = 3;
    } else if (Wiz.step === 3) {
      const name = q('#wizName').value.replace(/\s+/g, ' ').trim();
      const e = Ops.classNameError(name, wizYearId());
      if (e) { Wiz.name = name; return fail(e); }
      Wiz.name = name; Wiz.nameTouched = true;
      Wiz.step = 4;
    } else if (Wiz.step === 4) {
      Wiz.step = 5;
    } else if (Wiz.step === 5) {
      Wiz.step = 6;
    } else if (Wiz.step === 6) {
      const problems = wizProblems();
      if (problems.length) return fail('Ci sono problemi da sistemare prima di confermare.');
      Wiz.done = applyWizard();
      lastWizYearId = Wiz.done.yearId;
      await commit(`Classe ${Wiz.name} creata`);
    }
    render();
    window.scrollTo(0, 0);
  },
  wizBack() {
    if (!Wiz || Wiz.step <= 1) return;
    if (Wiz.step === 3) { const n = document.querySelector('#wizName'); if (n) Wiz.name = n.value.replace(/\s+/g, ' ').trim(); }
    Wiz.step--;
    render();
    window.scrollTo(0, 0);
  },
  async wizCancel() {
    if (!Wiz) { go('#/classi'); return; }
    if (Wiz.step > 1 || Wiz.adds.length) {
      const ok = await confirmDialog({ title: 'Annullare il passaggio?', message: 'Le scelte fatte finora vengono scartate. Nell\'archivio non è stato salvato nulla.', confirmLabel: 'Annulla il passaggio', danger: true });
      if (!ok) return;
    }
    Wiz = null;
    go('#/classi');
  },
  wizAll(el) {
    if (!Wiz) return;
    const studs = Q.studentsOfClass(Wiz.sourceId).filter(s => wizYearStatus(s.id).ok);
    Wiz.carry = el.dataset.v === '1' ? new Set(studs.map(s => s.id)) : new Set();
    render();
  },
  async wizAddOne() {
    if (!Wiz) return;
    const r = await dlgAddStudent(null, { name: Wiz.name, statusFn: wizStatus, extraNames: wizDraftNames() });
    if (!r) return;
    if (r.kind === 'link' && !wizStatus(r.studentId).ok) { toast('Studente non aggiungibile: ' + wizStatus(r.studentId).reason, 'error'); return; }
    Wiz.adds.push(r);
    render();
  },
  async wizAddList() {
    if (!Wiz) return;
    const items = await dlgImport(null, { name: Wiz.name, statusFn: wizStatus, seed: wizDraftNames() });
    if (!items) return;
    let skipped = 0;
    items.forEach(it => { if (it.kind === 'link' && !wizStatus(it.studentId).ok) skipped++; else Wiz.adds.push(it); });
    if (skipped) toast(`${skipped} non aggiunti perché già presenti nella nuova classe`, 'error');
    render();
  },
  wizRemoveAdd(el) {
    if (!Wiz) return;
    Wiz.adds.splice(Number(el.dataset.i), 1);
    render();
  },
  wizAgain() {
    const y = Q.year(lastWizYearId);
    Wiz = newWiz();
    if (y) { Wiz.target = { yearId: y.id, label: y.label }; Wiz.step = 2; }
    render();
    window.scrollTo(0, 0);
  },
  wizClose() { Wiz = null; go('#/classi'); }
});
// Passaggio classi: spunte degli studenti e scelta automatica di "Nuovo anno" quando si scrive l'anno
document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.wcarry;
  if (!id || !Wiz) return;
  if (e.target.checked) Wiz.carry.add(id); else Wiz.carry.delete(id);
  const el = document.getElementById('wizCount');
  if (el) el.textContent = el.textContent.replace(/^\d+/, String(Wiz.carry.size));
});
document.addEventListener('input', e => {
  if (e.target.id === 'wizNewYear') { const r = document.querySelector('input[name="wizYear"][value="new"]'); if (r) r.checked = true; }
});
Object.assign(Actions, {
  async exportJSON() { await exportBackup(); render(); },
  importJSON() { const f = document.getElementById('importFile'); if (f) { f.value = ''; f.click(); } },
  exportCSV() {
    const yid = document.getElementById('csvYear')?.value || 'all';
    const { count, text } = buildCSV(yid);
    if (!count) { toast('Nessun risultato da esportare per l\'anno scelto', 'error'); return; }
    const y = Q.year(yid);
    downloadFile(`registro-scienze-motorie-misure_${y ? y.label.replace('/', '-') + '_' : ''}${stamp()}.csv`, text, 'text/csv;charset=utf-8');
    toast(`Esportati ${count} risultati`);
  }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('Il file è troppo grande per essere un backup dell\'app', 'error'); return; }
  const text = typeof file.text === 'function' ? await file.text()
    : await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsText(file); });
  await handleImportText(text, file.name);
});
Object.assign(Actions, {
  dismissUpdate() { PWA.dismissed = true; document.getElementById('updateBar').hidden = true; },
  async applyUpdate() {
    // L'aggiornamento ricarica la pagina: prima si salva tutto e si avvisa se c'è una procedura da non perdere.
    await flushSave();
    if (Wiz && !Wiz.done) {
      const ok = await confirmDialog({ title: 'Aggiornare ora?', message: 'Hai un passaggio classi in corso: aggiornando verrà scartato. I dati già salvati non sono toccati.', confirmLabel: 'Aggiorna e scarta' });
      if (!ok) return;
    }
    if (PWA.waiting) {
      PWA.applying = true;
      PWA.waiting.postMessage({ type: 'SKIP_WAITING' });
      setTimeout(() => { if (PWA.applying) PWA.reload(); }, 4000);   // rete di sicurezza se il cambio non arriva
    } else PWA.reload();
  },
  async installApp() {
    const p = PWA.install;
    if (!p) return;
    PWA.install = null;
    try { p.prompt(); await p.userChoice; } catch (e) { /* scelta annullata */ }
    refreshDatiIfOpen();
  },
  async checkUpdate() {
    const sw = pwaSupported() ? navigator.serviceWorker : null;
    if (!PWA.reg || !sw) { toast('L\'uso offline non è attivo su questo dispositivo', 'error'); return; }
    try { await PWA.reg.update(); } catch (e) { /* offline: si prosegue con il controllo della pagina */ }
    if (PWA.reg.waiting && sw.controller) { PWA.waiting = PWA.reg.waiting; showUpdate(); return; }
    const w = PWA.reg.active || sw.controller;
    if (!w) { toast('Preparazione in corso: riprova tra qualche istante', 'error'); return; }
    w.postMessage({ type: 'CHECK_UPDATE' });
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const fn = ChangeActions[el.dataset.change];
  if (fn) fn(el, e);
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ---------- Avvio ---------- */
(async function start() {
  await Storage.init();
  try {
    const loaded = await Storage.load();
    if (loaded && loaded.app === APP_ID) S = loaded;
    if (migrateNames()) await commit();
  } catch (e) {
    console.error(e);
    toast('Archivio illeggibile: ripristina un backup', 'error');
  }
  document.getElementById('saveState').textContent = Storage.mode === 'memory' ? 'Non salvato' : '';
  render();
  initPWA();
})();
</script>
